<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ASWORLD — Next-Gen Stream Lab & Edge Proxy</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Players: Hls.js & Shaka Player -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>

    <style>
        :root {
            --bg: #090d16;
            --surface: #0f172a;
            --surface-hover: #1e293b;
            --border: #334155;
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.25);
            --accent: #a855f7;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --font-sans: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Top Header */
        header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0.85rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-main);
        }

        .brand-badge {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #000;
            font-weight: 800;
            font-size: 0.9rem;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .brand-title {
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: 0.05em;
        }

        .brand-tag {
            font-size: 0.7rem;
            padding: 0.2rem 0.5rem;
            border-radius: 999px;
            background: rgba(56, 189, 248, 0.15);
            color: var(--primary);
            border: 1px solid rgba(56, 189, 248, 0.3);
            text-transform: uppercase;
            font-family: var(--font-mono);
            font-weight: 600;
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn-link {
            padding: 0.45rem 0.85rem;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-decoration: none;
            border: 1px solid var(--border);
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-link:hover {
            color: var(--text-main);
            border-color: var(--primary);
            background: var(--surface);
        }

        /* Main Container Grid */
        main {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 1.5rem;
        }

        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        /* Player Box */
        .player-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .player-stage {
            position: relative;
            aspect-ratio: 16/9;
            background: #000;
            width: 100%;
            overflow: hidden;
        }

        #video-player {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        #iframe-player {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            display: none;
        }

        .player-loader {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            place-items: center;
            flex-direction: column;
            gap: 1rem;
            z-index: 10;
        }

        .player-loader.active {
            display: flex;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(56, 189, 248, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Player Controls & Info */
        .player-meta {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .stream-title-group h2 {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .live-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ef4444;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 8px #ef4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .stream-badges {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .badge {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .badge-active {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(56, 189, 248, 0.08);
        }

        /* Control Input Bar */
        .stream-input-section {
            padding: 1.25rem;
            background: rgba(15, 23, 42, 0.4);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .input-row {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .input-field {
            flex: 1;
            min-width: 250px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.65rem 1rem;
            border-radius: 8px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-glow);
        }

        .select-field {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.65rem 1rem;
            border-radius: 8px;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        .btn-action {
            background: linear-gradient(135deg, var(--primary), #0284c7);
            color: #000;
            font-weight: 600;
            border: none;
            padding: 0.65rem 1.4rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-action:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        /* Sidebar Panels */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .panel-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .preset-list {
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 380px;
            overflow-y: auto;
        }

        .preset-item {
            padding: 0.75rem 1rem;
            background: var(--bg);
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .preset-item:hover {
            border-color: var(--border);
            background: var(--surface-hover);
        }

        .preset-item.active {
            border-color: var(--primary);
            background: rgba(56, 189, 248, 0.08);
        }

        .preset-info {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .preset-name {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .preset-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .preset-tag {
            font-size: 0.7rem;
            font-family: var(--font-mono);
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            background: var(--surface);
            color: var(--text-muted);
        }

        /* Console & Diagnostics */
        .terminal-box {
            background: #050811;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin: 0.75rem;
            padding: 0.75rem;
            font-family: var(--font-mono);
            font-size: 0.78rem;
            color: #38bdf8;
            max-height: 240px;
            overflow-y: auto;
            line-height: 1.5;
        }

        .log-entry {
            margin-bottom: 0.35rem;
            word-break: break-all;
        }

        .log-time {
            color: var(--text-muted);
            margin-right: 0.4rem;
        }

        .log-err { color: var(--danger); }
        .log-ok { color: var(--success); }
        .log-warn { color: var(--warning); }
    </style>
</head>
<body>

    <header>
        <a href="/" class="brand">
            <div class="brand-badge">W</div>
            <div>
                <span class="brand-title">ASWORLD</span>
                <span class="brand-tag">Proxy Lab</span>
            </div>
        </a>
        <div class="header-nav">
            <a href="/" class="btn-link">Main Player</a>
            <a href="/asbuzz/" class="btn-link">ASBUZZ</a>
            <a href="https://t.me/aryanstreams" target="_blank" class="btn-link" style="border-color:var(--primary); color:var(--primary);">Telegram</a>
        </div>
    </header>

    <main>
        <!-- Left: Stage & Stream Controls -->
        <div class="player-card">
            <div class="player-stage">
                <!-- Video tag for direct HLS or MPD -->
                <video id="video-player" controls playsinline></video>
                <!-- Iframe for Trend48 or protected embeds -->
                <iframe id="iframe-player" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
                
                <div class="player-loader" id="loader">
                    <div class="spinner"></div>
                    <span style="font-size:0.85rem; font-family:var(--font-mono); color:var(--text-muted);">Routing through Edge Proxy...</span>
                </div>
            </div>

            <div class="player-meta">
                <div class="stream-title-group">
                    <h2 id="current-title">
                        <span class="live-pill"><span class="live-dot"></span> LIVE</span>
                        <span id="title-text">Select a Broadcast Feed</span>
                    </h2>
                </div>
                <div class="stream-badges">
                    <span class="badge" id="badge-engine">ENGINE: STANDBY</span>
                    <span class="badge" id="badge-proxy">PROXY: DIRECT</span>
                    <span class="badge" id="badge-latency">PING: --</span>
                </div>
            </div>

            <!-- Custom Input / Test Bar -->
            <div class="stream-input-section">
                <div class="input-row">
                    <input type="text" id="stream-url-input" class="input-field" placeholder="Paste .m3u8, .mpd, or embed link...">
                    <select id="proxy-selector" class="select-field">
                        <option value="direct">Direct (No Proxy)</option>
                        <option value="lovable">Lovable Edge Proxy (as-proxy.lovable.app)</option>
                        <option value="custom">Custom Worker Proxy</option>
                    </select>
                    <button class="btn-action" onclick="playCustomStream()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        <span>Launch</span>
                    </button>
                </div>
                <div class="input-row" style="margin-top:-0.3rem;" id="custom-proxy-row">
                    <input type="text" id="custom-proxy-input" class="input-field" placeholder="Custom proxy URL format: https://your-worker.workers.dev/?url=" style="display:none;">
                </div>
            </div>
        </div>

        <!-- Right: Server Presets & Console -->
        <div class="sidebar">
            <!-- Preset Channels -->
            <div class="panel">
                <div class="panel-header">
                    <span>Active Test Feeds</span>
                    <span style="font-size:0.75rem; color:var(--text-muted);">10 Servers</span>
                </div>
                <div class="preset-list" id="preset-container">
                    <!-- Presets injected via JS -->
                </div>
            </div>

            <!-- Edge Telemetry & Logs -->
            <div class="panel">
                <div class="panel-header">
                    <span>Edge Diagnostics</span>
                    <button class="btn-link" onclick="clearLogs()" style="padding:0.2rem 0.5rem; font-size:0.7rem;">Clear</button>
                </div>
                <div class="terminal-box" id="terminal-box">
                    <div class="log-entry"><span class="log-time">[INIT]</span> ASWORLD Stream Engine Ready.</div>
                    <div class="log-entry"><span class="log-time">[PROXY]</span> Edge Proxy Hook configured for unblocked global delivery.</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Preset Channel Definitions
        const PRESETS = [
            {
                name: 'Server 1: Movistar LaLiga',
                sub: 'Spain Feed • Trend48 Clean Edge',
                type: 'iframe',
                url: 'https://trend48.st/live-tv?ch=movistarlaliga-es'
            },
            {
                name: 'Server 2: Sky Sports Main Event',
                sub: 'UK Feed • Trend48 Clean Edge',
                type: 'iframe',
                url: 'https://trend48.st/live-tv?ch=skysportsmainevent-uk'
            },
            {
                name: 'Server 3: ESPN Deportes USA',
                sub: 'US Feed • Trend48 Clean Edge',
                type: 'iframe',
                url: 'https://trend48.st/live-tv?ch=espndeportes-usa'
            },
            {
                name: 'Server 6: Premier Sports 1 HD',
                sub: 'UK/IE Official • Trend48 Edge',
                type: 'iframe',
                url: 'https://trend48.st/live-tv?ch=premiersports1-ie'
            },
            {
                name: 'Server 7: DAZN LaLiga Spain',
                sub: 'Spain Co-Rights • Trend48 Edge',
                type: 'iframe',
                url: 'https://trend48.st/live-tv?ch=daznlaliga-es'
            },
            {
                name: 'Willow Cricket HD (Server 1)',
                sub: 'USA Direct • Trend48 Edge',
                type: 'iframe',
                url: 'https://trend48.st/live-tv?ch=willow-usa'
            },
            {
                name: 'Sky Sports Cricket HD',
                sub: 'UK Live • Trend48 Edge',
                type: 'iframe',
                url: 'https://trend48.st/live-tv?ch=skysportscricket-uk'
            },
            {
                name: 'Sony Ten 1 HD (Lovable Proxy M3U8)',
                sub: 'M3U8 via as-proxy.lovable.app',
                type: 'hls',
                url: 'https://as-proxy.lovable.app/api/public/px/sony?url=https://dishmt.slivcdn.com/hls/live/2011747/TEN1HD/master.m3u8'
            },
            {
                name: 'Sony Ten 2 HD (Lovable Proxy M3U8)',
                sub: 'M3U8 via as-proxy.lovable.app',
                type: 'hls',
                url: 'https://as-proxy.lovable.app/api/public/px/sony?url=https://dishmt.slivcdn.com/hls/live/2020434/TEN2HD/master.m3u8'
            }
        ];

        let hlsInstance = null;
        let shakaPlayer = null;

        function log(msg, type = 'info') {
            const box = document.getElementById('terminal-box');
            const time = new Date().toLocaleTimeString();
            const el = document.createElement('div');
            el.className = 'log-entry';
            let colorClass = '';
            if (type === 'err') colorClass = 'log-err';
            else if (type === 'ok') colorClass = 'log-ok';
            else if (type === 'warn') colorClass = 'log-warn';
            el.innerHTML = `<span class="log-time">[${time}]</span> <span class="${colorClass}">${msg}</span>`;
            box.appendChild(el);
            box.scrollTop = box.scrollHeight;
        }

        function clearLogs() {
            document.getElementById('terminal-box').innerHTML = '';
        }

        function renderPresets() {
            const container = document.getElementById('preset-container');
            container.innerHTML = '';
            PRESETS.forEach((p, idx) => {
                const item = document.createElement('div');
                item.className = `preset-item ${idx === 0 ? 'active' : ''}`;
                item.onclick = () => selectPreset(idx);
                item.innerHTML = `
                    <div class="preset-info">
                        <span class="preset-name">${p.name}</span>
                        <span class="preset-sub">${p.sub}</span>
                    </div>
                    <span class="preset-tag">${p.type.toUpperCase()}</span>
                `;
                container.appendChild(item);
            });
        }

        function selectPreset(idx) {
            document.querySelectorAll('.preset-item').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
            });
            const p = PRESETS[idx];
            document.getElementById('title-text').textContent = p.name;
            document.getElementById('stream-url-input').value = p.url;
            loadStream(p.url, p.type);
        }

        function loadStream(url, explicitType) {
            const video = document.getElementById('video-player');
            const iframe = document.getElementById('iframe-player');
            const loader = document.getElementById('loader');
            const badgeEngine = document.getElementById('badge-engine');
            const badgeProxy = document.getElementById('badge-proxy');

            loader.classList.add('active');
            log(`Loading: ${url}`, 'info');

            // Reset current players
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            if (shakaPlayer) {
                shakaPlayer.destroy();
                shakaPlayer = null;
            }
            video.pause();
            video.removeAttribute('src');
            video.load();

            // Detect type
            const isM3U8 = explicitType === 'hls' || url.includes('.m3u8');
            const isMPD = explicitType === 'mpd' || url.includes('.mpd');
            const isEmbed = explicitType === 'iframe' || (!isM3U8 && !isMPD);

            if (isEmbed) {
                // Iframe Mode
                video.style.display = 'none';
                iframe.style.display = 'block';
                iframe.src = url;
                badgeEngine.textContent = 'ENGINE: IFRAME EMBED';
                badgeProxy.textContent = url.includes('trend48') ? 'PROXY: TREND48 EDGE' : 'PROXY: DIRECT';
                iframe.onload = () => {
                    loader.classList.remove('active');
                    log(`Embed frame loaded successfully`, 'ok');
                };
            } else if (isM3U8) {
                // HLS Mode
                iframe.style.display = 'none';
                video.style.display = 'block';
                badgeEngine.textContent = 'ENGINE: HLS.JS';

                if (Hls.isSupported()) {
                    hlsInstance = new Hls({
                        enableWorker: true,
                        lowLatencyMode: true,
                        backBufferLength: 60
                    });
                    hlsInstance.loadSource(url);
                    hlsInstance.attachMedia(video);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                        loader.classList.remove('active');
                        video.play().catch(() => {});
                        log(`HLS Manifest parsed. Playback started.`, 'ok');
                    });
                    hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                        if (data.fatal) {
                            loader.classList.remove('active');
                            log(`Fatal HLS error: ${data.type} (${data.details})`, 'err');
                        }
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    video.addEventListener('loadedmetadata', () => {
                        loader.classList.remove('active');
                        video.play();
                    });
                }
            } else if (isMPD) {
                // DASH / Shaka Mode
                iframe.style.display = 'none';
                video.style.display = 'block';
                badgeEngine.textContent = 'ENGINE: SHAKA DASH';

                shaka.polyfill.installAll();
                if (shaka.Player.isBrowserSupported()) {
                    shakaPlayer = new shaka.Player(video);
                    shakaPlayer.load(url).then(() => {
                        loader.classList.remove('active');
                        video.play();
                        log(`DASH manifest loaded via Shaka.`, 'ok');
                    }).catch(err => {
                        loader.classList.remove('active');
                        log(`Shaka error: ${err.message || err.code}`, 'err');
                    });
                }
            }
        }

        function playCustomStream() {
            let url = document.getElementById('stream-url-input').value.trim();
            if (!url) return;

            const proxyMode = document.getElementById('proxy-selector').value;
            let finalUrl = url;

            if (proxyMode === 'lovable') {
                if (!url.includes('as-proxy.lovable.app')) {
                    finalUrl = `https://as-proxy.lovable.app/api/public/px/sony?url=${encodeURIComponent(url)}`;
                }
            } else if (proxyMode === 'custom') {
                const customProxy = document.getElementById('custom-proxy-input').value.trim();
                if (customProxy) {
                    finalUrl = `${customProxy}${encodeURIComponent(url)}`;
                }
            }

            document.getElementById('title-text').textContent = 'Custom Stream';
            loadStream(finalUrl);
        }

        // Toggle custom proxy input visibility
        document.getElementById('proxy-selector').addEventListener('change', e => {
            const isCustom = e.target.value === 'custom';
            document.getElementById('custom-proxy-input').style.display = isCustom ? 'block' : 'none';
        });

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            renderPresets();
            selectPreset(0);
        });
    </script>
</body>
</html>
