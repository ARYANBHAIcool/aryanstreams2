<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AryanStreams Global | Free Live Sports & 24/7 Channels</title>
    <meta name="description" content="StreamCorner Style Free Live Sports, 24/7 Channels, MLB, NFL, SOCCER, UFC, PPV Events, NBA League Pass, Sling TV, Paramount+">

    <!-- Tailwind CSS & HLS.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#22c55e',
                            600: '#16a34a',
                            dark: '#07090d',
                            card: '#0f172a',
                            border: '#1e293b'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #07090d;
            color: #e2e8f0;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
        .card-hover {
            transition: all 0.2s ease-in-out;
        }
        .card-hover:hover {
            transform: translateY(-3px);
            border-color: #22c55e;
            box-shadow: 0 12px 30px -5px rgba(34, 197, 94, 0.18);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-50 bg-[#07090d]/95 backdrop-blur-md border-b border-gray-800/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <!-- Brand Logo -->
            <a href="/" class="flex items-center gap-3 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-green-600 to-green-400 flex items-center justify-center text-black font-black text-xl shadow-lg shadow-green-500/20 group-hover:scale-105 transition-transform">
                    A
                </div>
                <div class="flex flex-col">
                    <span class="text-xl font-bold tracking-wider uppercase text-white">
                        Aryan<span class="text-green-400">Streams</span>
                    </span>
                    <span class="text-[10px] text-gray-400 tracking-widest uppercase font-semibold">Global Stream Hub</span>
                </div>
            </a>

            <!-- Nav Links -->
            <nav class="hidden md:flex items-center gap-6 text-xs uppercase tracking-widest font-semibold">
                <button onclick="filterCategory('ALL')" class="text-white hover:text-green-400 transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    Home
                </button>
                <button onclick="filterCategory('24/7 CHANNELS')" class="text-gray-400 hover:text-white transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                    24/7 Channels
                </button>
                <button onclick="toggleMultiviewer()" class="text-gray-400 hover:text-white transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                    Multiviewer
                </button>
            </nav>

            <!-- Telegram Link -->
            <div class="flex items-center gap-3">
                <a href="https://t.me/aryanstreams" target="_blank" class="px-4 py-2 bg-green-500 hover:bg-green-600 text-black font-bold text-xs uppercase tracking-wider rounded-lg shadow-lg shadow-green-500/20 transition-all flex items-center gap-2">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.69-.52.36-1 .54-1.43.53-.48-.01-1.4-.27-2.09-.49-.84-.28-1.51-.43-1.45-.91.03-.25.38-.51 1.07-.78 4.19-1.82 6.98-3.02 8.37-3.6 3.98-1.65 4.81-1.94 5.35-1.95.12 0 .38.03.55.17.14.12.18.28.2.45-.02.07-.02.16-.03.27z"/></svg>
                    Join Telegram
                </a>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- Category Bar -->
        <div class="flex items-center gap-2 overflow-x-auto custom-scrollbar pb-2 border-b border-gray-800">
            <button onclick="filterCategory('ALL')" id="cat-ALL" class="cat-pill px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider bg-green-500 text-black shadow-lg shadow-green-500/20 whitespace-nowrap">
                🔥 All Events
            </button>
            <button onclick="filterCategory('FOOTBALL')" id="cat-FOOTBALL" class="cat-pill px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider bg-gray-900 hover:bg-gray-800 text-gray-300 border border-gray-800 whitespace-nowrap">
                ⚽ Football
            </button>
            <button onclick="filterCategory('CRICKET')" id="cat-CRICKET" class="cat-pill px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider bg-gray-900 hover:bg-gray-800 text-gray-300 border border-gray-800 whitespace-nowrap">
                🏏 Cricket
            </button>

            <button onclick="filterCategory('24/7 CHANNELS')" id="cat-24/7 CHANNELS" class="cat-pill px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider bg-gray-900 hover:bg-gray-800 text-gray-300 border border-gray-800 whitespace-nowrap">
                📺 24/7 Channels
            </button>
        </div>

        <!-- Stream Player Viewport Section -->
        <section id="player-section" class="hidden bg-slate-900/90 border border-gray-800 rounded-2xl overflow-hidden shadow-2xl space-y-3 p-4">
            <div class="flex items-center justify-between border-b border-gray-800 pb-3">
                <div class="flex items-center gap-3">
                    <span class="w-3 h-3 rounded-full bg-green-500 animate-ping"></span>
                    <h2 id="active-match-title" class="text-base font-bold text-white tracking-wide">Live Stream</h2>
                </div>
                <button onclick="closePlayer()" class="px-3 py-1 bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white rounded-lg text-xs font-bold transition-all">
                    ✕ Close Player
                </button>
            </div>
            
            <div id="player-viewport-container" class="rounded-xl overflow-hidden bg-black aspect-video w-full"></div>
        </section>

        <!-- Live Matches & Channels Grid -->
        <section class="space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="text-sm font-bold uppercase tracking-widest text-gray-400 flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-green-400 animate-pulse"></span>
                    Live Matches & Stream Channels
                </h3>
                <span id="match-count" class="text-xs text-gray-400 font-semibold bg-slate-900 px-3 py-1 rounded-full border border-gray-800">
                    Loading Events...
                </span>
            </div>

            <!-- Grid -->
            <div id="matches-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Dynamic cards -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="mt-auto border-t border-gray-800 bg-[#07090d] py-6">
        <div class="max-w-7xl mx-auto px-4 text-center space-y-2">
            <p class="text-xs text-gray-400 font-medium">
                © 2026 ARYANSTREAMS GLOBAL. All media streams embedded directly from public third-party sources.
            </p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/player.js"></script>
    <script>
        let currentFilter = 'ALL';

        document.addEventListener('DOMContentLoaded', async () => {
            await window.AryanGlobalAPI.init();
            renderMatches();
        });

        function filterCategory(cat) {
            currentFilter = cat;
            document.querySelectorAll('.cat-pill').forEach(btn => {
                btn.classList.remove('bg-green-500', 'text-black', 'shadow-lg');
                btn.classList.add('bg-gray-900', 'text-gray-300');
            });
            const activeBtn = document.getElementById('cat-' + cat);
            if (activeBtn) {
                activeBtn.classList.remove('bg-gray-900', 'text-gray-300');
                activeBtn.classList.add('bg-green-500', 'text-black', 'shadow-lg');
            }
            renderMatches();
        }

        function renderMatches() {
            const grid = document.getElementById('matches-grid');
            const items = window.AryanGlobalAPI.getAllItems();

            let html = '';
            let count = 0;

            items.forEach(item => {
                if (currentFilter !== 'ALL' && item.category !== currentFilter) {
                    return;
                }
                count++;

                const serverCount = item.servers ? item.servers.length : 1;
                const isMatch = item.homeLogo && item.awayLogo;

                html += `
                    <div onclick="openStream('${item.id}')" class="card-hover bg-slate-900/90 border border-gray-800/80 rounded-2xl p-4 cursor-pointer flex flex-col justify-between space-y-4">
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-md bg-green-500/10 text-green-400 border border-green-500/20">
                                ${item.category || 'LIVE'}
                            </span>
                            <div class="flex items-center gap-1.5 text-[11px] font-semibold text-gray-400 bg-black/40 px-2.5 py-1 rounded-md border border-gray-800">
                                <span class="w-2 h-2 rounded-full ${item.isLive ? 'bg-green-400 animate-pulse' : 'bg-yellow-400'}"></span>
                                ${serverCount} Active ${serverCount === 1 ? 'Server' : 'Servers'}
                            </div>
                        </div>

                        ${isMatch ? `
                            <div class="flex items-center justify-between py-2 px-2 bg-black/30 rounded-xl border border-gray-800/50">
                                <div class="flex items-center gap-2">
                                    <img src="${item.homeLogo}" class="w-7 h-7 object-contain rounded-full bg-slate-800 p-0.5" alt="Home">
                                    <span class="text-xs font-bold text-white truncate max-w-[100px]">${item.title.split(' vs. ')[0] || 'Team A'}</span>
                                </div>
                                <span class="text-[10px] font-black text-green-400 bg-green-500/10 px-2 py-0.5 rounded">VS</span>
                                <div class="flex items-center gap-2">
                                    <span class="text-xs font-bold text-white truncate max-w-[100px]">${item.title.split(' vs. ')[1] || 'Team B'}</span>
                                    <img src="${item.awayLogo}" class="w-7 h-7 object-contain rounded-full bg-slate-800 p-0.5" alt="Away">
                                </div>
                            </div>
                        ` : ''}

                        <div class="space-y-1">
                            <h4 class="text-sm font-bold text-white group-hover:text-green-400 transition-colors leading-snug">
                                ${item.name || item.title}
                            </h4>
                            <p class="text-xs text-gray-400">${item.time || 'Click to select active server'}</p>
                        </div>

                        <div class="pt-2 border-t border-gray-800/60 flex items-center justify-between text-xs font-bold text-green-400">
                            <span class="flex items-center gap-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                WATCH NOW
                            </span>
                            <span class="text-gray-400 text-[11px] font-normal">HD 1080p</span>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html || `<div class="col-span-full py-12 text-center text-gray-400 text-sm font-medium">No live streams found in this category right now.</div>`;
            document.getElementById('match-count').innerText = `${count} Active Events`;
        }

        function openStream(id) {
            const item = window.AryanGlobalAPI.getItemById(id);
            if (!item) return;

            document.getElementById('active-match-title').innerText = item.name || item.title;
            const playerSection = document.getElementById('player-section');
            playerSection.classList.remove('hidden');
            playerSection.scrollIntoView({ behavior: 'smooth' });

            window.AryanPlayerEngine.init('player-viewport-container', item);
        }

        function closePlayer() {
            document.getElementById('player-section').classList.add('hidden');
            document.getElementById('player-viewport-container').innerHTML = '';
        }

        function toggleMultiviewer() {
            alert('Multiviewer Mode: Select multiple channels side-by-side!');
        }
    </script>
</body>
</html>
