    <!-- App Render Logic -->
    <script>
        let currentFilter = 'ALL';
        let currentView = 'home';

        document.addEventListener('DOMContentLoaded', () => {
            renderMatchesGrid();
            renderProviders();
            renderChannelsView();
            populateMultiviewerDropdowns();
        });

        function switchView(viewName) {
            currentView = viewName;
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-channels').classList.add('hidden');
            document.getElementById('view-multiviewer').classList.add('hidden');

            document.getElementById('view-' + viewName).classList.remove('hidden');
        }

        function filterCategory(cat) {
            currentFilter = cat;
            if (cat === '24/7 STREAMS') {
                switchView('channels');
                return;
            }
            if (currentView !== 'home') {
                switchView('home');
            }

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = 'tab-btn px-6 py-2 rounded-lg text-xs font-black uppercase tracking-wider text-gray-400 hover:text-white transition-all';
            });
            const activeTab = document.getElementById('tab-' + cat);
            if (activeTab) {
                activeTab.className = 'tab-btn px-6 py-2 rounded-lg text-xs font-black uppercase tracking-wider transition-all bg-amber-400 text-black shadow-md';
            }

            renderMatchesGrid();
        }

        function renderMatchesGrid() {
            const grid = document.getElementById('matches-grid');
            let items = window.AryanGlobalAPI.getAllMatches();

            if (currentFilter === 'LIVE NOW') {
                items = items.filter(m => m.isLive);
            } else if (currentFilter === 'TODAY') {
                items = items.filter(m => m.startTime.includes('09/10/26') || m.startTime.includes('TODAY'));
            } else if (currentFilter !== 'ALL') {
                items = items.filter(m => m.sport === currentFilter || m.league === currentFilter);
            }

            if (items.length === 0) {
                grid.innerHTML = `<div class="col-span-full p-8 text-center text-xs text-gray-500 bg-[#121824] rounded-2xl border border-gray-800">No active matches found for this filter category.</div>`;
                return;
            }

            grid.innerHTML = items.map(m => createStreamCornerCard(m)).join('');
        }

        function createStreamCornerCard(m) {
            const t1Short = m.team1.name.substring(0, 5).toUpperCase();
            const t2Short = m.team2.name.substring(0, 5).toUpperCase();
            return `
                <div onclick="openPlayerModal('${m.id}')" class="card-hover bg-[#121824] border border-gray-800/90 rounded-2xl overflow-hidden cursor-pointer flex flex-col justify-between group shadow-lg">
                    
                    <!-- TOP GRAPHIC BANNER AREA (Exact Dual Team Logos + VS Badge) -->
                    <div class="h-[140px] bg-gradient-to-b from-[#182030] to-[#101622] relative flex items-center justify-between px-5 overflow-hidden border-b border-gray-800/80">
                        
                        <!-- Left Team Badge -->
                        <div class="flex flex-col items-center gap-1 z-10">
                            <div class="w-14 h-14 rounded-full bg-slate-900 border border-gray-700 flex items-center justify-center text-xs font-black text-white shadow-xl group-hover:scale-105 transition-transform overflow-hidden p-1">
                                <img src="${m.team1.logo}" class="max-h-full max-w-full object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" alt="">
                                <span class="hidden text-[10px] font-black text-amber-400">${t1Short}</span>
                            </div>
                        </div>

                        <!-- VS / LIVE Badge -->
                        <div class="z-10 bg-black/80 border border-gray-700/80 text-[10px] font-black text-white px-2.5 py-1 rounded-full uppercase tracking-widest shadow-md">
                            ${m.isLive ? `<span class="text-red-500 animate-pulse font-extrabold">LIVE</span>` : `VS`}
                        </div>

                        <!-- Right Team Badge -->
                        <div class="flex flex-col items-center gap-1 z-10">
                            <div class="w-14 h-14 rounded-full bg-slate-900 border border-gray-700 flex items-center justify-center text-xs font-black text-white shadow-xl group-hover:scale-105 transition-transform overflow-hidden p-1">
                                <img src="${m.team2.logo}" class="max-h-full max-w-full object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" alt="">
                                <span class="hidden text-[10px] font-black text-amber-400">${t2Short}</span>
                            </div>
                        </div>

                        <!-- Background Ambient Blur -->
                        <div class="absolute inset-0 bg-gradient-to-r from-blue-900/10 via-transparent to-red-900/10"></div>
                    </div>

                    <!-- MATCH TITLE AREA -->
                    <div class="px-4 pt-3 pb-2 flex-1">
                        <h4 class="font-bold text-xs text-white tracking-wide leading-snug line-clamp-2 uppercase">${m.title}</h4>
                    </div>

                    <!-- METADATA FOOTER (START TIME & LEAGUE) -->
                    <div class="px-4 py-2 text-[11px] font-semibold text-gray-400 space-y-1">
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] text-gray-500 uppercase tracking-wider font-bold">START TIME</span>
                            <span class="text-gray-200 font-bold">${m.startTime}</span>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] text-gray-500 uppercase tracking-wider font-bold">LEAGUE</span>
                            <span class="text-amber-400 font-extrabold uppercase tracking-wider text-[10px]">${m.league}</span>
                        </div>
                    </div>

                    <!-- WATCH NOW BUTTON (Exact StreamCorner Green Play Icon Button) -->
                    <div class="px-4 pb-4 pt-1">
                        <button class="w-full py-2.5 bg-[#1b2434] group-hover:bg-green-500 group-hover:text-black text-gray-200 font-bold text-xs uppercase tracking-wider rounded-xl transition-all border border-gray-700/60 flex items-center justify-center gap-2">
                            <svg class="w-3.5 h-3.5 fill-current text-green-400 group-hover:text-black" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                            Watch Now
                        </button>
                    </div>

                </div>
            `;
        }

        function renderProviders() {
            const grid = document.getElementById('providers-grid');
            grid.innerHTML = window.AryanGlobalAPI.providers.map(p => `
                <div class="h-28 rounded-2xl ${p.bg} p-4 flex items-center justify-center shadow-lg hover:opacity-90 transition-opacity cursor-pointer">
                    <img src="${p.logo}" class="max-h-full max-w-full object-contain" alt="${p.name}">
                </div>
            `).join('');
        }

        function renderChannelsView() {
            const grid = document.getElementById('channels-grid');
            const channels = window.AryanGlobalAPI.getChannels();
            grid.innerHTML = channels.map(ch => `
                <div onclick="openPlayerModal('${ch.id}')" class="card-hover bg-[#121824] border border-gray-800 rounded-2xl p-4 cursor-pointer flex flex-col items-center justify-between text-center space-y-3 group">
                    <div class="w-16 h-16 rounded-xl bg-black/60 p-2 flex items-center justify-center border border-gray-800 group-hover:border-green-500 transition-colors">
                        <img src="${ch.logo}" class="max-h-full max-w-full object-contain" alt="${ch.name}">
                    </div>
                    <div>
                        <h4 class="font-extrabold text-xs text-white uppercase tracking-wider">${ch.name}</h4>
                        <span class="text-[10px] text-green-400 font-bold uppercase tracking-widest">24/7 LIVE</span>
                    </div>
                    <button class="w-full py-2 bg-[#1b2434] group-hover:bg-green-500 group-hover:text-black text-gray-200 font-bold text-xs uppercase tracking-wider rounded-xl transition-all border border-gray-700/60 flex items-center justify-center gap-1.5">
                        ▶ Watch Live
                    </button>
                </div>
            `).join('');
        }

        function openPlayerModal(id) {
            const item = window.AryanGlobalAPI.getItemById(id);
            if (!item) return;

            document.getElementById('player-match-title').innerText = item.title || item.name;
            document.getElementById('player-match-league').innerText = item.league || item.category;
            document.getElementById('player-status-badge').innerText = item.isLive ? 'LIVE' : 'STREAM';

            document.getElementById('player-modal').classList.remove('hidden');

            window.AryanPlayerEngine.init('player-viewport-container', item);
        }

        function closePlayerModal() {
            document.getElementById('player-modal').classList.add('hidden');
            if (window.AryanPlayerEngine.hls) {
                window.AryanPlayerEngine.hls.destroy();
                window.AryanPlayerEngine.hls = null;
            }
            document.getElementById('player-viewport-container').innerHTML = '';
        }

        function populateMultiviewerDropdowns() {
            const allItems = [...window.AryanGlobalAPI.getAllMatches(), ...window.AryanGlobalAPI.getChannels()];
            const selects = document.querySelectorAll('#view-multiviewer select');
            selects.forEach(select => {
                select.innerHTML = `<option value="">-- Select Stream --</option>` + allItems.map(item => `<option value="${item.id}">${item.title || item.name}</option>`).join('');
            });
        }

        function loadMultiviewerStream(screenNum, id) {
            const viewport = document.getElementById(`mv-viewport-${screenNum}`);
            if (!id) {
                viewport.innerHTML = `Screen ${screenNum} Ready`;
                return;
            }

            const item = window.AryanGlobalAPI.getItemById(id);
            if (!item) return;

            const server = (item.servers && item.servers[0]) ? item.servers[0] : item;
            if (server.type === 'video') {
                viewport.innerHTML = `<video id="mv-vid-${screenNum}" class="w-full h-full object-contain" controls autoplay playsinline></video>`;
                const vid = document.getElementById(`mv-vid-${screenNum}`);
                if (Hls.isSupported() && server.url.includes('.m3u8')) {
                    const hls = new Hls();
                    hls.loadSource(server.url);
                    hls.attachMedia(vid);
                } else {
                    vid.src = server.url;
                }
            } else {
                viewport.innerHTML = `<iframe src="${server.url}" class="w-full h-full border-0" allowfullscreen allow="autoplay"></iframe>`;
            }
        }
    </script>
</body>
</html>
