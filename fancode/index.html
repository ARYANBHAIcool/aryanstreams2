<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FanCode Live | Stream Hub</title>
    <meta name="referrer" content="no-referrer">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#0a0a0f; --card:rgba(18,18,28,0.85); --border:rgba(255,255,255,0.06); --accent:#6366f1; --accent2:#818cf8; --live:#ef4444; --text:#e2e8f0; --muted:#64748b; --surface:rgba(255,255,255,0.03); }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; min-height:100vh; }
        body::before { content:""; position:fixed; inset:0; background:radial-gradient(ellipse at 20% -10%,rgba(99,102,241,0.08),transparent 60%),radial-gradient(ellipse at 80% 110%,rgba(139,92,246,0.06),transparent 50%); pointer-events:none; }

        .header { padding:1.25rem; border-bottom:1px solid var(--border); background:rgba(10,10,15,0.8); backdrop-filter:blur(20px); position:sticky; top:0; z-index:50; }
        .header-inner { max-width:1200px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:0.75rem; }
        .logo { display:flex; align-items:center; gap:0.6rem; font-weight:800; font-size:1.1rem; }
        .logo-icon { width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg,var(--accent),#a855f7); display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff; }
        .stats-bar { display:flex; gap:1rem; font-size:0.78rem; color:var(--muted); }
        .stat-pill { display:flex; align-items:center; gap:0.3rem; background:var(--surface); border:1px solid var(--border); padding:0.25rem 0.65rem; border-radius:99px; }
        .dot { width:6px; height:6px; border-radius:50%; }
        .dot-live { background:var(--live); box-shadow:0 0 6px var(--live); animation:pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }

        .filters { max-width:1200px; margin:0 auto; padding:0.75rem 1.25rem; display:flex; gap:0.4rem; flex-wrap:wrap; }
        .filter-btn { background:var(--surface); border:1px solid var(--border); color:var(--muted); padding:0.35rem 0.9rem; border-radius:99px; font-size:0.75rem; font-weight:600; cursor:pointer; transition:all 0.2s; font-family:inherit; }
        .filter-btn:hover { border-color:rgba(255,255,255,0.15); color:var(--text); }
        .filter-btn.active { background:linear-gradient(135deg,var(--accent),#7c3aed); border-color:transparent; color:#fff; }

        .section-title { max-width:1200px; margin:0 auto; padding:1.25rem 1.25rem 0.4rem; font-size:0.8rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:1px; display:flex; align-items:center; gap:8px; }
        .count { background:var(--surface); border:1px solid var(--border); padding:2px 8px; border-radius:99px; font-size:0.7rem; }

        .grid { max-width:1200px; margin:0 auto; padding:0.5rem 1.25rem 2rem; display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:1rem; }
        .card { background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; backdrop-filter:blur(12px); transition:transform 0.3s,border-color 0.3s; }
        .card:hover { transform:translateY(-3px); border-color:rgba(99,102,241,0.2); }
        .card-img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:#111; }
        .card-body { padding:0.9rem 1rem 1rem; }
        .card-meta { display:flex; align-items:center; justify-content:space-between; margin-bottom:0.4rem; }
        .badge-live { display:inline-flex; align-items:center; gap:4px; background:var(--live); color:#fff; font-size:0.6rem; font-weight:800; padding:2px 8px; border-radius:99px; letter-spacing:0.5px; }
        .badge-live::before { content:""; width:5px; height:5px; border-radius:50%; background:#fff; animation:pulse 1.2s infinite; }
        .badge-upcoming { background:rgba(255,255,255,0.06); color:var(--muted); font-size:0.6rem; font-weight:700; padding:2px 8px; border-radius:99px; }
        .badge-cat { font-size:0.62rem; font-weight:600; color:var(--accent2); text-transform:uppercase; letter-spacing:0.5px; }
        .card-title { font-size:0.9rem; font-weight:700; color:#fff; margin-bottom:0.2rem; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        .card-tournament { font-size:0.72rem; color:var(--muted); margin-bottom:0.1rem; }
        .card-time { font-size:0.68rem; color:var(--muted); margin-bottom:0.6rem; }
        .card-lang { font-size:0.6rem; font-weight:700; background:rgba(99,102,241,0.12); color:var(--accent2); padding:2px 6px; border-radius:4px; display:inline-block; margin-bottom:0.6rem; }

        .btn-watch { width:100%; padding:0.6rem; border-radius:10px; font-size:0.75rem; font-weight:700; border:none; cursor:pointer; transition:all 0.2s; font-family:inherit; text-align:center; text-decoration:none; display:block; }
        .btn-watch.live { background:linear-gradient(135deg,var(--accent),#7c3aed); color:#fff; }
        .btn-watch.live:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(99,102,241,0.3); }
        .btn-watch.disabled { background:rgba(255,255,255,0.04); color:#475569; cursor:not-allowed; }

        /* Quality Modal */
        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); backdrop-filter:blur(10px); z-index:1000; align-items:center; justify-content:center; padding:20px; }
        .modal-overlay.show { display:flex; animation:fadeIn 0.2s; }
        @keyframes fadeIn { from{opacity:0}to{opacity:1} }
        .modal-content { background:linear-gradient(180deg,#0d1424,#080c16); width:100%; max-width:380px; padding:2rem 1.5rem; border-radius:24px; border:1px solid rgba(99,102,241,0.3); text-align:center; box-shadow:0 30px 60px rgba(0,0,0,0.5); animation:slideUp 0.25s; }
        @keyframes slideUp { from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1} }
        .modal-content h3 { font-size:1.2rem; font-weight:800; margin-bottom:0.3rem; }
        .modal-content .sub { color:var(--muted); font-size:0.8rem; margin-bottom:1.25rem; }
        .quality-btn { background:rgba(255,255,255,0.03); border:1px solid var(--border); width:100%; padding:0.85rem 1rem; margin-bottom:0.5rem; border-radius:12px; font-weight:700; font-size:0.85rem; color:#fff; display:flex; justify-content:space-between; align-items:center; cursor:pointer; transition:0.2s; font-family:inherit; }
        .quality-btn:hover { background:linear-gradient(135deg,rgba(99,102,241,0.12),rgba(236,72,153,0.08)); border-color:var(--accent); transform:translateX(3px); }
        .quality-btn .hd-badge { background:linear-gradient(135deg,var(--accent),#ec4899); font-size:0.6rem; padding:3px 7px; border-radius:5px; font-weight:800; letter-spacing:0.3px; }
        .close-modal { margin-top:1rem; color:var(--muted); font-weight:600; cursor:pointer; font-size:0.8rem; padding:8px; transition:0.2s; background:none; border:none; font-family:inherit; }
        .close-modal:hover { color:var(--live); }

        .loader-wrap { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:5rem 2rem; color:var(--muted); }
        .loader-spin { width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; margin-bottom:0.75rem; animation:spin 0.8s linear infinite; }
        @keyframes spin { to{transform:rotate(360deg)} }

        @media (max-width:600px) { .grid{grid-template-columns:1fr} .header-inner{flex-direction:column;align-items:flex-start} }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="logo"><div class="logo-icon">⚡</div><span>FanCode Live</span></div>
            <div class="stats-bar">
                <div class="stat-pill"><span class="dot dot-live"></span> <span id="live-count">0</span> Live</div>
                <div class="stat-pill"><span id="total-count">0</span> Total</div>
            </div>
        </div>
    </header>
    <div class="filters" id="filters"></div>
    <div id="live-section" style="display:none"><div class="section-title">🔴 Live Now <span class="count" id="live-badge">0</span></div><div class="grid" id="live-grid"></div></div>
    <div id="upcoming-section" style="display:none"><div class="section-title">⏳ Upcoming <span class="count" id="upcoming-badge">0</span></div><div class="grid" id="upcoming-grid"></div></div>
    <div id="loader" class="loader-wrap"><div class="loader-spin"></div><span>Loading matches...</span></div>

    <!-- Quality Picker Modal -->
    <div id="quality-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Choose Quality</h3>
            <div class="sub">Pick a stream resolution below</div>
            <div id="quality-list"></div>
            <button class="close-modal" onclick="closeModal()">CLOSE</button>
        </div>
    </div>

<script>
(function() {
    const API = "https://raw.githubusercontent.com/doctor-8trange/zyphx8/refs/heads/main/data/fancode.json";
    const FALLBACK_IMG = "https://www.fancode.com/skillup-uploads/cms-media/Cricket_Fallback_Old_match-card.jpg";
    let allMatches = [], currentFilter = "ALL";

    function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

    function dedup(arr) {
        const seen = new Set();
        return arr.filter(m => { const k = m.match_id+"_"+(m.language||""); if(seen.has(k)) return false; seen.add(k); return true; });
    }

    // Parse the auto_streams M3U8 text to get quality URLs with tokens
    function parseQualities(m) {
        const cdn = m.STREAMING_CDN || {};
        const autoStreams = m.auto_streams;

        // DRM streams — no quality picker, go straight to shaka
        if (cdn.is_drm && cdn.drm && cdn.drm.clearkey) {
            const [kid, key] = cdn.drm.clearkey.split(":");
            const url = cdn.Primary_Playback_URL || "";
            return [{ res: "DRM Stream", url: "shaka_player.html?mpd=" + encodeURIComponent(url) + "&kid=" + encodeURIComponent(kid) + "&key=" + encodeURIComponent(key) + "&referer=" + encodeURIComponent("https://fancode.com/"), isDrm: true }];
        }

        // HLS with auto_streams — parse M3U8 for quality levels with tokens
        if (autoStreams && autoStreams.length > 0 && autoStreams[0].auto) {
            const text = autoStreams[0].auto;
            const lines = text.split("\n");
            const qualities = [];
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].includes("RESOLUTION=")) {
                    const resPart = lines[i].split("RESOLUTION=")[1].split(",")[0];
                    const height = resPart.split("x")[1];
                    const streamUrl = (lines[i+1] || "").trim();
                    if (streamUrl && streamUrl.startsWith("http")) {
                        qualities.push({ res: height + "p", url: streamUrl, isHd: parseInt(height) >= 720 });
                    }
                }
            }
            return qualities;
        }

        // Fallback — use Primary URL without token (may not work)
        const url = cdn.Primary_Playback_URL;
        if (url) return [{ res: "Auto", url: url }];
        return [];
    }

    window.openQuality = function(index) {
        const m = allMatches[index];
        const qualities = parseQualities(m);
        const list = document.getElementById("quality-list");
        list.innerHTML = "";

        if (qualities.length === 0) { alert("Stream not available"); return; }

        // If only 1 quality (like DRM), go directly
        if (qualities.length === 1) {
            if (qualities[0].isDrm) {
                window.location.href = qualities[0].url;
            } else {
                window.location.href = "player?url=" + encodeURIComponent(qualities[0].url);
            }
            return;
        }

        qualities.forEach(q => {
            const btn = document.createElement("button");
            btn.className = "quality-btn";
            const isHd = q.isHd || parseInt(q.res) >= 720;
            btn.innerHTML = '<span>📺 ' + esc(q.res) + '</span>' + (isHd ? '<span class="hd-badge">HD</span>' : '');
            btn.onclick = function() {
                if (q.isDrm) {
                    window.location.href = q.url;
                } else {
                    window.location.href = "player?url=" + encodeURIComponent(q.url);
                }
            };
            list.appendChild(btn);
        });

        document.getElementById("quality-modal").classList.add("show");
    };

    window.closeModal = function() {
        document.getElementById("quality-modal").classList.remove("show");
    };
    document.getElementById("quality-modal").addEventListener("click", function(e) {
        if (e.target.id === "quality-modal") closeModal();
    });

    function renderCard(m, globalIndex) {
        const isLive = (m.status||"").toUpperCase() === "LIVE";
        const img = m.image || (m.image_cdn && m.image_cdn.APP) || FALLBACK_IMG;
        const badge = isLive ? '<span class="badge-live">LIVE</span>' : '<span class="badge-upcoming">UPCOMING</span>';
        const btn = isLive
            ? '<button class="btn-watch live" onclick="openQuality('+globalIndex+')">▶ WATCH LIVE</button>'
            : '<button class="btn-watch disabled" disabled>⏳ Not Live Yet</button>';

        return '<div class="card"><img class="card-img" src="'+esc(img)+'" loading="lazy" onerror="this.src=\''+FALLBACK_IMG+'\'" alt="">'
            + '<div class="card-body"><div class="card-meta">'+badge+'<span class="badge-cat">'+esc(m.category||'Sports')+'</span></div>'
            + '<div class="card-title">'+esc(m.title)+'</div>'
            + '<div class="card-tournament">'+esc(m.tournament)+'</div>'
            + '<div class="card-time">🕐 '+esc(m.startTime||'TBA')+'</div>'
            + '<span class="card-lang">'+esc(m.language||'EN')+'</span>'
            + '<div>'+btn+'</div></div></div>';
    }

    function render(filter) {
        currentFilter = filter;
        const filtered = filter === "ALL" ? allMatches : allMatches.filter(m => (m.category||"").toUpperCase() === filter.toUpperCase());
        const live = filtered.filter(m => (m.status||"").toUpperCase() === "LIVE");
        const upcoming = filtered.filter(m => (m.status||"").toUpperCase() !== "LIVE");

        const ls = document.getElementById("live-section"), us = document.getElementById("upcoming-section");
        if (live.length > 0) {
            ls.style.display = "block";
            document.getElementById("live-badge").textContent = live.length;
            document.getElementById("live-grid").innerHTML = live.map(m => renderCard(m, allMatches.indexOf(m))).join("");
        } else ls.style.display = "none";

        if (upcoming.length > 0) {
            us.style.display = "block";
            document.getElementById("upcoming-badge").textContent = upcoming.length;
            document.getElementById("upcoming-grid").innerHTML = upcoming.map(m => renderCard(m, allMatches.indexOf(m))).join("");
        } else us.style.display = "none";

        document.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b.dataset.filter === filter));
    }

    function buildFilters(matches) {
        const cats = [...new Set(matches.map(m => m.category || "Other"))];
        const c = document.getElementById("filters");
        c.innerHTML = '<button class="filter-btn active" data-filter="ALL">All</button>' + cats.map(cat => '<button class="filter-btn" data-filter="'+esc(cat)+'">'+esc(cat)+'</button>').join("");
        c.addEventListener("click", e => { if (e.target.classList.contains("filter-btn")) render(e.target.dataset.filter); });
    }

    fetch(API, { cache: "no-store" }).then(r => r.json()).then(data => {
        document.getElementById("loader").style.display = "none";
        allMatches = dedup(data.matches || []);
        const lc = allMatches.filter(m => (m.status||"").toUpperCase() === "LIVE").length;
        document.getElementById("live-count").textContent = lc;
        document.getElementById("total-count").textContent = allMatches.length;
        buildFilters(allMatches);
        render("ALL");
    }).catch(() => {
        document.getElementById("loader").innerHTML = '<p style="color:#ef4444">Failed to load. Refresh to retry.</p>';
    });

    // Auto-refresh every 5 min
    setInterval(() => {
        fetch(API, { cache: "no-store" }).then(r => r.json()).then(data => {
            allMatches = dedup(data.matches || []);
            document.getElementById("live-count").textContent = allMatches.filter(m => (m.status||"").toUpperCase() === "LIVE").length;
            document.getElementById("total-count").textContent = allMatches.length;
            render(currentFilter);
        }).catch(() => {});
    }, 5 * 60 * 1000);
})();
</script>
</body>
</html>
