<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>Player</title>
    <!-- Shaka Player -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@5.2.4/dist/controls.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
        #player-container {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        /* Hide Shaka's built-in spinner */
        .shaka-spinner-container, .shaka-spinner, .shaka-spinner-svg { display: none !important; }
        
        /* Hide Shaka's built-in spinner */
        .shaka-spinner-container, .shaka-spinner, .shaka-spinner-svg { display: none !important; }
        
        /* Ultra-sleek Loading Status Overlay */
        #loading {
            position: fixed; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0.85) 0%, rgba(0, 0, 0, 0.96) 100%);
            z-index: 100; opacity: 1; visibility: visible;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.4s ease;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            text-align: center; color: #fff; padding: 20px;
        }
        #loading.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        
        .loading-card {
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(59, 130, 246, 0.2);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 28px 36px; border-radius: 20px;
            display: flex; flex-direction: column; align-items: center; gap: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(59, 130, 246, 0.1);
            max-width: 360px; width: 90%; animation: pulseGlow 3s ease-in-out infinite alternate;
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(59, 130, 246, 0.08); }
            100% { box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 35px rgba(59, 130, 246, 0.22); }
        }

        .spinner-wrapper {
            position: relative; width: 52px; height: 52px;
            display: flex; align-items: center; justify-content: center;
        }
        .spinner {
            position: absolute; inset: 0;
            border: 3px solid rgba(59, 130, 246, 0.15);
            border-top-color: #3b82f6; border-right-color: #60a5fa;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner-center-dot {
            width: 10px; height: 10px; background: #3b82f6; border-radius: 50%;
            box-shadow: 0 0 10px #3b82f6; animation: pulseDot 1.2s ease-in-out infinite alternate;
        }
        @keyframes pulseDot { 0% { transform: scale(0.8); opacity: 0.6; } 100% { transform: scale(1.2); opacity: 1; } }

        .loading-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 12px; background: rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.25); border-radius: 20px;
            font-size: 11px; font-weight: 600; color: #60a5fa;
            letter-spacing: 0.8px; text-transform: uppercase;
        }
        .loading-badge .live-dot {
            width: 6px; height: 6px; background: #60a5fa; border-radius: 50%;
            box-shadow: 0 0 8px #60a5fa;
        }

        .loading-title {
            font-size: 15px; font-weight: 600; color: #f8fafc; letter-spacing: -0.2px;
        }
        .loading-subtext {
            font-size: 12px; color: #94a3b8; line-height: 1.5; font-weight: 400;
        }

        /* Professional Status Toast Banner */
        #status-toast {
            position: fixed; top: 18px; left: 50%; transform: translateX(-50%) translateY(-25px);
            opacity: 0; pointer-events: none;
            padding: 8px 18px; border-radius: 30px; font-size: 12.5px; font-weight: 500;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; align-items: center; gap: 8px; z-index: 200;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            letter-spacing: 0.2px;
        }
        #status-toast.show {
            opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto;
        }
        #status-toast.success {
            background: rgba(6, 78, 59, 0.85); color: #6ee7b7; border: 1px solid rgba(52, 211, 153, 0.3);
        }
        #status-toast.error {
            background: rgba(127, 29, 29, 0.85); color: #fca5a5; border: 1px solid rgba(248, 113, 113, 0.3);
        }
    </style>
</head>
<body>

    <div id="loading">
        <div class="loading-card">
            <div class="spinner-wrapper">
                <div class="spinner"></div>
                <div class="spinner-center-dot"></div>
            </div>
            <div class="loading-badge">
                <span class="live-dot"></span> CONNECTING
            </div>
            <div class="loading-title">Initializing Stream</div>
            <div class="loading-subtext">Connecting to CDN server... Please wait a moment.</div>
        </div>
    </div>

    <div id="player-container">
        <video id="video" playsinline webkit-playsinline autoplay></video>
    </div>

    <div id="status-toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/shaka-player@5.2.4/dist/shaka-player.ui.min.js"></script>
    <script>
    (function() {
        "use strict";

        // ΓöÇΓöÇ Configuration ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
        // You can pass parameters via URL:
        //   ?mpd=<MPD_URL>&kid=<KEY_ID>&key=<KEY>&referer=<REFERER>
        //
        // Or use the hash format (for iframe embedding):
        //   #mpd=<MPD_URL>&kid=<KEY_ID>&key=<KEY>
        //
        // Example:
        //   shaka_player.html?mpd=https://...cenc.mpd&kid=1d0c...&key=ad27...
        // ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ

        var params = new URLSearchParams(location.search || location.hash.replace('#',''));

        var MPD_URL  = params.get('mpd')  || '';
        var KEY_ID   = params.get('kid')  || '';
        var KEY      = params.get('key')  || '';
        var REFERER  = params.get('referer') || 'https://www.amazon.com/gp/';

        var $video   = document.getElementById('video');
        var $loading = document.getElementById('loading');
        var $toast   = document.getElementById('status-toast');
        var toastTimer = null;
        var loadedSuccessShown = false;

        function showToast(msg, type) {
            clearTimeout(toastTimer);
            $toast.textContent = msg;
            $toast.className = 'show ' + (type || 'success');
            toastTimer = setTimeout(function() {
                $toast.classList.remove('show');
            }, 3000);
        }

        function showError(msg) {
            showToast('● CONNECTION FAILED • Retrying...', 'error');
        }

        function hideLoading() {
            if (!$loading.classList.contains('hidden')) {
                $loading.classList.add('hidden');
                if (!loadedSuccessShown) {
                    loadedSuccessShown = true;
                    showToast('● LIVE STREAM CONNECTED', 'success');
                }
            }
        }

        if (!MPD_URL) {
            hideLoading();
            showError('No MPD URL provided. Use ?mpd=<URL>&kid=<KEY_ID>&key=<KEY>');
            return;
        }

        // ΓöÇΓöÇ Init Shaka ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
        shaka.polyfill.installAll();

        if (!shaka.Player.isBrowserSupported()) {
            hideLoading();
            showError('Browser not supported for DASH playback.');
            return;
        }

        var player = new shaka.Player();

        player.attach($video).then(function() {
            // Add Shaka UI controls (play, volume, fullscreen, quality etc.)
            var ui = new shaka.ui.Overlay(player, document.getElementById('player-container'), $video);
            ui.configure({
                controlPanelElements: [
                    'play_pause', 'mute', 'volume', 'spacer',
                    'time_and_duration', 'spacer',
                    'quality', 'picture_in_picture', 'fullscreen'
                ],
                seekBarColors: {
                    base: '#555',
                    buffered: '#888',
                    played: '#3b82f6'
                }
            });

            // Smart request filter:
            // - On *.pages.dev: proxy restricted CDNs (aiv-cdn.net/com) to bypass origin blacklist.
            // - On Custom Domains (.com, .net, etc.): all CDNs are 100% direct with 0 worker requests.
            player.getNetworkingEngine().registerRequestFilter(function(type, req) {
                var url = req.uris[0];
                var isRestrictedHost = location.hostname.endsWith('.pages.dev') || location.hostname.endsWith('.vercel.app');
                if (isRestrictedHost && url && (url.includes('aiv-cdn.net') || url.includes('aiv-cdn.com')) && !url.includes('/proxy/')) {
                    req.uris[0] = '/proxy/' + url;
                }
            });

            // ── Build player config ─────────────────────────────────────────
            var config = {
                streaming: {
                    lowLatencyMode: true,
                    bufferingGoal: 15,
                    rebufferingGoal: 2,
                    stallEnabled: true,
                    retryParameters: {
                        maxAttempts: 5,
                        baseDelay: 1000,
                        backoffFactor: 2
                    }
                },
                manifest: {
                    dash: {
                        autoCorrectDrift: true
                    },
                    retryParameters: {
                        maxAttempts: 5,
                        baseDelay: 1000,
                        backoffFactor: 2
                    }
                },
                abr: {
                    enabled: true,
                    defaultBandwidthEstimate: 2000000
                }
            };

            // Add DRM clear-keys if provided
            if (KEY_ID && KEY) {
                config.drm = {
                    clearKeys: {}
                };
                config.drm.clearKeys[KEY_ID] = KEY;
            }

            player.configure(config);

            // ΓöÇΓöÇ Load and play ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
            player.load(MPD_URL).then(function() {
                $video.muted = true;  // muted autoplay (browsers require this)
                $video.play().catch(function() {});
            }).catch(function(e) {
                console.error('Load error:', e);
                showError('Stream load failed ΓÇô retrying...');
                setTimeout(function() { location.reload(); }, 5000);
            });

            // ΓöÇΓöÇ Events ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
            $video.addEventListener('playing', function() {
                hideLoading();
            });

            $video.addEventListener('canplay', function() {
                hideLoading();
            });

            player.addEventListener('error', function(ev) {
                var err = ev.detail;
                if (err && err.severity === shaka.util.Error.Severity.RECOVERABLE) return;
                console.error('Shaka error:', err && err.code, err && err.message);
                showError('Playback error ΓÇô retrying...');
                setTimeout(function() { player.load(MPD_URL).catch(function(){}); }, 5000);
            });

            // Unmute on first user interaction
            document.addEventListener('click', function unmute() {
                $video.muted = false;
                document.removeEventListener('click', unmute);
            }, { once: true });

        }).catch(function(e) {
            hideLoading();
            showError('Player init failed: ' + e.message);
        });

    })();
    </script>
</body>
</html>
