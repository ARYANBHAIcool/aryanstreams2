<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>Player</title>
    <!-- Shaka Player -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@5.2.4/dist/controls.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
        #player-container {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        /* Hide Shaka's built-in spinner */
        .shaka-spinner-container, .shaka-spinner, .shaka-spinner-svg { display: none !important; }
        
        /* Stream Loading Status Overlay */
        #loading {
            position: fixed; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.92); z-index: 100;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center; color: #fff; padding: 20px;
        }
        #loading.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .loading-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            padding: 24px 32px; border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; gap: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 340px; width: 90%;
        }
        .spinner {
            width: 44px; height: 44px;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-title {
            font-size: 16px; font-weight: 600; color: #f3f4f6; letter-spacing: 0.3px;
        }
        .loading-subtext {
            font-size: 12px; color: #9ca3af; line-height: 1.4;
        }

        /* Status Toast Banner (Success / Error) */
        #status-toast {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-20px);
            opacity: 0; pointer-events: none;
            padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 500;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; align-items: center; gap: 8px; z-index: 200;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }
        #status-toast.show {
            opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto;
        }
        #status-toast.success {
            background: rgba(16, 185, 129, 0.95); color: #fff; border: 1px solid rgba(255,255,255,0.2);
        }
        #status-toast.error {
            background: rgba(239, 68, 68, 0.95); color: #fff; border: 1px solid rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

    <div id="loading">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-title">⏳ Stream Loading...</div>
            <div class="loading-subtext">Connecting to live stream server. Please wait a moment.</div>
        </div>
    </div>

    <div id="player-container">
        <video id="video" playsinline webkit-playsinline autoplay></video>
    </div>

    <div id="status-toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/shaka-player@5.2.4/dist/shaka-player.ui.min.js"></script>
    <script>
    (function() {
        "use strict";

        // ΓöÇΓöÇ Configuration ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
        // You can pass parameters via URL:
        //   ?mpd=<MPD_URL>&kid=<KEY_ID>&key=<KEY>&referer=<REFERER>
        //
        // Or use the hash format (for iframe embedding):
        //   #mpd=<MPD_URL>&kid=<KEY_ID>&key=<KEY>
        //
        // Example:
        //   shaka_player.html?mpd=https://...cenc.mpd&kid=1d0c...&key=ad27...
        // ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ

        var params = new URLSearchParams(location.search || location.hash.replace('#',''));

        var MPD_URL  = params.get('mpd')  || '';
        var KEY_ID   = params.get('kid')  || '';
        var KEY      = params.get('key')  || '';
        var REFERER  = params.get('referer') || 'https://www.amazon.com/gp/';

        var $video   = document.getElementById('video');
        var $loading = document.getElementById('loading');
        var $toast   = document.getElementById('status-toast');
        var toastTimer = null;
        var loadedSuccessShown = false;

        function showToast(msg, type) {
            clearTimeout(toastTimer);
            $toast.textContent = msg;
            $toast.className = 'show ' + (type || 'success');
            toastTimer = setTimeout(function() {
                $toast.classList.remove('show');
            }, 3000);
        }

        function showError(msg) {
            showToast('❌ ' + msg, 'error');
        }

        function hideLoading() {
            if (!$loading.classList.contains('hidden')) {
                $loading.classList.add('hidden');
                if (!loadedSuccessShown) {
                    loadedSuccessShown = true;
                    showToast('✅ Stream Connected Successfully!', 'success');
                }
            }
        }

        if (!MPD_URL) {
            hideLoading();
            showError('No MPD URL provided. Use ?mpd=<URL>&kid=<KEY_ID>&key=<KEY>');
            return;
        }

        // ΓöÇΓöÇ Init Shaka ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
        shaka.polyfill.installAll();

        if (!shaka.Player.isBrowserSupported()) {
            hideLoading();
            showError('Browser not supported for DASH playback.');
            return;
        }

        var player = new shaka.Player();

        player.attach($video).then(function() {
            // Add Shaka UI controls (play, volume, fullscreen, quality etc.)
            var ui = new shaka.ui.Overlay(player, document.getElementById('player-container'), $video);
            ui.configure({
                controlPanelElements: [
                    'play_pause', 'mute', 'volume', 'spacer',
                    'time_and_duration', 'spacer',
                    'quality', 'picture_in_picture', 'fullscreen'
                ],
                seekBarColors: {
                    base: '#555',
                    buffered: '#888',
                    played: '#3b82f6'
                }
            });

            // ΓöÇΓöÇ Inject Referer header (required for Amazon CDN) ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
            player.getNetworkingEngine().registerRequestFilter(function(type, req) {
                var url = req.uris[0];
                if (url && (url.includes('aiv-cdn.net') || url.includes('aiv-cdn.com') || url.includes('pv-cdn.net')) && !url.includes('/proxy')) {
                    req.uris[0] = '/proxy/' + url;
                }
                if (req.uris[0] && !req.uris[0].includes('/proxy')) {
                    try {
                        req.headers['Referer'] = REFERER;
                    } catch(e) {}
                }
                req.headers['User-Agent'] = navigator.userAgent;
            });

            // ΓöÇΓöÇ Build player config ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
            var config = {
                manifest: {
                    defaultPresentationDelay: 4,
                    dash: { autoCorrectDrift: true, ignoreMinBufferTime: true },
                    retryParameters: { baseDelay: 100 }
                },
                streaming: {
                    bufferingGoal: 8,
                    rebufferingGoal: 1.5,
                    bufferBehind: 20,
                    retryParameters: { baseDelay: 100, maxAttempts: 5 }
                },
                abr: {
                    enabled: true,
                    defaultBandwidthEstimate: 1500000,
                    restrictions: { maxHeight: 1080 }
                }
            };

            // Add DRM clear-keys if provided
            if (KEY_ID && KEY) {
                config.drm = {
                    clearKeys: {}
                };
                config.drm.clearKeys[KEY_ID] = KEY;
            }

            player.configure(config);

            // ΓöÇΓöÇ Load and play ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
            player.load(MPD_URL).then(function() {
                $video.muted = true;  // muted autoplay (browsers require this)
                $video.play().catch(function() {});
            }).catch(function(e) {
                console.error('Load error:', e);
                showError('Stream load failed ΓÇô retrying...');
                setTimeout(function() { location.reload(); }, 5000);
            });

            // ΓöÇΓöÇ Events ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
            $video.addEventListener('playing', function() {
                hideLoading();
            });

            $video.addEventListener('canplay', function() {
                hideLoading();
            });

            player.addEventListener('error', function(ev) {
                var err = ev.detail;
                if (err && err.severity === shaka.util.Error.Severity.RECOVERABLE) return;
                console.error('Shaka error:', err && err.code, err && err.message);
                showError('Playback error ΓÇô retrying...');
                setTimeout(function() { player.load(MPD_URL).catch(function(){}); }, 5000);
            });

            // Unmute on first user interaction
            document.addEventListener('click', function unmute() {
                $video.muted = false;
                document.removeEventListener('click', unmute);
            }, { once: true });

        }).catch(function(e) {
            hideLoading();
            showError('Player init failed: ' + e.message);
        });

    })();
    </script>
</body>
</html>
