<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>Player</title>

    <!-- Shaka Player -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@5.2.4/dist/controls.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
        #player-container,
        #player-container:fullscreen,
        #player-container:-webkit-full-screen {
            position: fixed;
            inset: 0;
            width: 100% !important;
            height: 100% !important;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000 !important;
        }
        video,
        :fullscreen video,
        :-webkit-full-screen video,
        :-moz-full-screen video,
        :-ms-fullscreen video,
        .shaka-video-container video {
            width: 100% !important;
            height: 100% !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            object-fit: contain !important;
            background: #000000 !important;
        }
        /* Hide Shaka's built-in spinner */
        .shaka-spinner-container, .shaka-spinner, .shaka-spinner-svg { display: none !important; }
        
        /* Cool Minimalist Loader Overlay */
        #loading {
            position: fixed; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: #0c0e12;
            z-index: 100; opacity: 1; visibility: visible;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.4s ease;
            pointer-events: none;
        }
        #loading.hidden { opacity: 0; visibility: hidden; }

        .cool-loader {
            position: relative;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cool-loader-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.07);
            border-top-color: #3b82f6;
            border-right-color: rgba(59, 130, 246, 0.45);
            animation: loader-spin 0.8s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
            filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.4));
        }
        .cool-loader-core {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3b82f6;
            box-shadow: 0 0 12px #3b82f6;
            animation: loader-pulse 1.2s ease-in-out infinite;
        }
        @keyframes loader-spin {
            to { transform: rotate(360deg); }
        }
        @keyframes loader-pulse {
            0%, 100% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.25); opacity: 1; }
        }

        /* Professional Status Toast Banner */
        #status-toast {
            position: fixed; top: 18px; left: 50%; transform: translateX(-50%) translateY(-25px);
            opacity: 0; pointer-events: none;
            padding: 8px 18px; border-radius: 30px; font-size: 12.5px; font-weight: 500;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; align-items: center; gap: 8px; z-index: 200;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            letter-spacing: 0.2px;
        }
        #status-toast.show {
            opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto;
        }
        #status-toast.success {
            background: rgba(6, 78, 59, 0.85); color: #6ee7b7; border: 1px solid rgba(52, 211, 153, 0.3);
        }
        #status-toast.error {
            background: rgba(127, 29, 29, 0.85); color: #fca5a5; border: 1px solid rgba(248, 113, 113, 0.3);
        }
    </style>
    <!-- Adsterra Popunder -->
    <script type="text/javascript" src="https://pl31503790.profitableratecpmnetwork.com/ec/8c/af/ec8caf215d92bd77dfa766d702a1ec0f.js"></script>
</head>
<body>

    <div id="loading">
        <div class="cool-loader">
            <div class="cool-loader-ring"></div>
            <div class="cool-loader-core"></div>
        </div>
    </div>

    <div id="player-container">
        <video id="video" playsinline webkit-playsinline autoplay style="width:100%; height:100%; object-fit:contain; background:#000;"></video>
    </div>

    <div id="status-toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/shaka-player@5.2.4/dist/shaka-player.ui.min.js"></script>
    <script>
    (function() {
        "use strict";

        var params = new URLSearchParams(location.search || location.hash.replace('#',''));

        var MPD_URL  = params.get('mpd')  || '';
        var KEY_ID   = params.get('kid')  || '';
        var KEY      = params.get('key')  || '';
        var CH_ID    = params.get('chid') || params.get('id') || '';
        var COOKIE   = params.get('cookie') || '';
        var REFERER  = params.get('referer') || '';

        var $video   = document.getElementById('video');
        var $loading = document.getElementById('loading');
        var $toast   = document.getElementById('status-toast');
        var toastTimer = null;
        var loadedSuccessShown = false;

        function showToast(msg, type) {
            clearTimeout(toastTimer);
            $toast.textContent = msg;
            $toast.className = 'show ' + (type || 'success');
            toastTimer = setTimeout(function() {
                $toast.classList.remove('show');
            }, 3000);
        }

        function showError(msg) {
            showToast('● CONNECTION FAILED • Retrying...', 'error');
        }

        function hideLoading() {
            if (!$loading.classList.contains('hidden')) {
                $loading.classList.add('hidden');
                if (!loadedSuccessShown) {
                    loadedSuccessShown = true;
                    showToast('● LIVE STREAM CONNECTED', 'success');
                }
            }
        }

        var ID_MAP = {
            'ss1h': '1108', 'ss1': '1106', 'ss1tam': '3277', 'ss1tel': '3278', 'ss1kan': '1650',
            'ss2': '1109', 'ss2h': '1984', 'ss2tam': '3273', 'ss2tel': '3274', 'ss2kan': '1122',
            'ss3': '1389', 'ssselect1': '460', 'ssselect2': '461', 'sskhel': '1998',
            'h1hd': '1108', 'e1hd': '1106', 'h2hd': '1984', 'e2hd': '1109',
            's2hd': '3273', 'te2hd': '3274', 'ka1sd': '1650', 'ka2sd': '1122',
            'se1hd': '460', 'se2hd': '461', 'h1sd': '1998',
            'ten1': '162', 'ten2': '891', 'ten3': '892', 'ten4': '1773', 'ten5': '155',
            'ten1hd': '162', 'ten2hd': '891', 'ten3hd': '892', 'ten4hd': '1773', 'ten5hd': '155',
            'sten1': '162', 'sten2': '891', 'sten3': '892', 'sten4': '1773', 'sten5': '155', 'sten5hd': '155',
            'sony1': '162', 'sony2': '891', 'sony3': '892', 'sony4': '1773', 'sony5': '155', 'sonyten5': '155',
            'sony_ten1_hd': '162', 'sony_ten2_hd': '891', 'sony_ten3_hd': '892', 'sony_ten4_tamil': '3514', 'sony_ten4_telugu': '1773', 'sony_ten5_hd': '155',
            'dds': '204', 'ddsports': '204', 'eurosport': '875', 'eurohd': '875', 'eurosport_hd': '875'
        };

        function rawCookie(c) {
            if (!c) return "";
            return c.startsWith("__hdnea__=") ? c.slice(10) : c;
        }
        function formatCookieHeader(c) {
            if (!c) return "";
            return c.startsWith("__hdnea__=") ? c : "__hdnea__=" + c;
        }
        function withCookie(u, r) {
            if (!u || !r) return u;
            if (u.indexOf("__hdnea__") !== -1) return u;
            return u + (u.indexOf("?") !== -1 ? "&" : "?") + "__hdnea__=" + r;
        }

        async function fetchChannelData(id) {
            var endpoints = [
                'https://raw.githubusercontent.com/sportlive18/jio-tv-auto-update-playlist/refs/heads/main/star2.json',
                'https://my-api-5e7.pages.dev/jiotv2.json',
                'https://sonujson-v5.pages.dev/Data/sports.json',
                'https://sonujson-v3.pages.dev/Data/sports.json'
            ];
            var idStr = String(id).trim().toLowerCase();
            var mappedId = (ID_MAP[idStr] || idStr).toLowerCase();

            for (var i = 0; i < endpoints.length; i++) {
                try {
                    var res = await fetch(endpoints[i], { cache: 'no-store' });
                    if (!res.ok) continue;
                    var json = await res.json();
                    var list = (json && (json.channels || json.data)) || (Array.isArray(json) ? json : []);
                    if (Array.isArray(list)) {
                        var target = list.find(function(c) {
                            var chId = String(c.id || c.channel_id || '').toLowerCase();
                            var chName = String(c.name || c.channel_name || '').toLowerCase();
                            return chId === mappedId || chId === idStr || chName === idStr || chName.includes(idStr) || (mappedId && chName.includes(mappedId));
                        });
                        if (target) {
                            return {
                                name: target.name || target.channel_name,
                                stream_url: target.stream_url || target.channel_url || target.url,
                                key_id: target.key_id || target.keyId || target.kid,
                                key: target.key,
                                cookie: target.cookie || ''
                            };
                        }
                    }
                } catch (e) {}
            }
            return null;
        }

        async function initPlayer() {
            var activeMpd = MPD_URL;
            var activeKid = KEY_ID;
            var activeKey = KEY;
            var activeCookie = COOKIE;
            var activeRawCookie = rawCookie(COOKIE);

            if (CH_ID && (!activeMpd || !activeKey)) {
                showToast('Connecting Channel...', 'info');
                var ch = await fetchChannelData(CH_ID);
                if (ch) {
                    activeMpd = ch.stream_url;
                    activeKid = ch.key_id;
                    activeKey = ch.key;
                    activeCookie = ch.cookie || '';
                    activeRawCookie = rawCookie(activeCookie);
                }
            }

            if (!activeMpd) {
                hideLoading();
                showError('No MPD URL provided. Use ?mpd=<URL>&kid=<KEY_ID>&key=<KEY> or ?chid=<ID>');
                return;
            }

            shaka.polyfill.installAll();

            if (!shaka.Player.isBrowserSupported()) {
                hideLoading();
                showError('Browser not supported for DASH playback.');
                return;
            }

            var player = new shaka.Player();

            try {
                await player.attach($video);
                var ui = new shaka.ui.Overlay(player, document.getElementById('player-container'), $video);
                ui.configure({
                    controlPanelElements: [
                        'play_pause', 'mute', 'volume', 'spacer',
                        'time_and_duration', 'spacer',
                        'quality', 'picture_in_picture', 'fullscreen'
                    ],
                    seekBarColors: {
                        base: '#555',
                        buffered: '#888',
                        played: '#3b82f6'
                    }
                });

                player.getNetworkingEngine().registerRequestFilter(function(type, req) {
                    var url = req.uris[0];
                    if (url && (url.includes('aiv-cdn.net') || url.includes('aiv-cdn.com')) && !url.includes('stream-relay-buddy.lovable.app') && !url.includes('/proxy/')) {
                        req.uris[0] = 'https://stream-relay-buddy.lovable.app/api/public/proxy?url=' + encodeURIComponent(url);
                    }

                    var isJio = (url && (url.includes('jiotv') || url.includes('jio.com'))) || (activeCookie && activeCookie.length > 0);
                    if (isJio) {
                        req.headers["Referer"] = REFERER || "https://www.jiotv.com/";
                        req.headers["User-Agent"] = "Mozilla/5.0 (Linux; Android 11; SM-G991B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36";
                        if (activeCookie) {
                            req.headers["Cookie"] = formatCookieHeader(activeCookie);
                        }
                        if (activeRawCookie && (type === shaka.net.NetworkingEngine.RequestType.MANIFEST || type === shaka.net.NetworkingEngine.RequestType.SEGMENT)) {
                            req.uris = req.uris.map(function(u) { return withCookie(u, activeRawCookie); });
                        }
                    } else if (REFERER) {
                        req.headers["Referer"] = REFERER;
                    }
                });

                var config = {
                    streaming: {
                        lowLatencyMode: true,
                        bufferingGoal: 15,
                        rebufferingGoal: 2,
                        stallEnabled: true,
                        retryParameters: {
                            maxAttempts: 5,
                            baseDelay: 1000,
                            backoffFactor: 2
                        }
                    },
                    manifest: {
                        dash: {
                            autoCorrectDrift: true
                        },
                        retryParameters: {
                            maxAttempts: 5,
                            baseDelay: 1000,
                            backoffFactor: 2
                        }
                    },
                    abr: {
                        enabled: true,
                        defaultBandwidthEstimate: 2000000
                    }
                };

                if (activeKid && activeKey) {
                    config.drm = {
                        clearKeys: {}
                    };
                    config.drm.clearKeys[activeKid] = activeKey;
                }

                player.configure(config);

                await player.load(activeMpd);
                $video.muted = true;
                $video.play().catch(function() {});

                $video.addEventListener('playing', function() {
                    hideLoading();
                });

                $video.addEventListener('canplay', function() {
                    hideLoading();
                });

                player.addEventListener('error', function(ev) {
                    var err = ev.detail;
                    if (err && err.severity === shaka.util.Error.Severity.RECOVERABLE) return;
                    console.error('Shaka error:', err && err.code, err && err.message);
                    showError('Playback error – retrying...');
                    setTimeout(function() { player.load(activeMpd).catch(function(){}); }, 5000);
                });
            } catch(e) {
                console.error('Init error:', e);
                showError('Stream load failed – retrying...');
                setTimeout(function() { location.reload(); }, 4000);
            }
        }

        initPlayer();

        // Unmute and trigger direct link ad with smart cooldown
        var shakaAdFiredCount = 0;
        var maxShakaAds = 3;
        var lastShakaAdTime = 0;
        var SHAKA_AD_COOLDOWN = 60000;

        function triggerShakaAd() {
            var now = Date.now();
            if (shakaAdFiredCount >= maxShakaAds) return;
            if (lastShakaAdTime !== 0 && (now - lastShakaAdTime < SHAKA_AD_COOLDOWN)) return;
            lastShakaAdTime = now;
            shakaAdFiredCount++;
            try {
                window.open('https://www.profitableratecpmnetwork.com/t8e8e5yh?key=6da983d7e115700ad4dc612c0e107ec8', '_blank');
            } catch (err) {}
        }

        document.addEventListener('click', function unmuteAndAd() {
            $video.muted = false;
            triggerShakaAd();
        });

        // ── Mobile Screen Auto-Rotate & Fullscreen Fit ───────────────────
        function lockLandscape() {
            try {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(function() {});
                } else if (screen.lockOrientation) {
                    screen.lockOrientation('landscape');
                } else if (screen.mozLockOrientation) {
                    screen.mozLockOrientation('landscape');
                } else if (screen.msLockOrientation) {
                    screen.msLockOrientation('landscape');
                }
            } catch (e) {}
        }

        function unlockOrientation() {
            try {
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                } else if (screen.unlockOrientation) {
                    screen.unlockOrientation();
                } else if (screen.mozUnlockOrientation) {
                    screen.mozUnlockOrientation();
                } else if (screen.msUnlockOrientation) {
                    screen.msUnlockOrientation();
                }
            } catch (e) {}
        }

        function handleFullscreenChange() {
            var isFs = !!(
                document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.mozFullScreenElement ||
                document.msFullscreenElement
            );
            if (isFs) {
                lockLandscape();
            } else {
                unlockOrientation();
            }
        }
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        document.addEventListener('mozfullscreenchange', handleFullscreenChange);
        document.addEventListener('MSFullscreenChange', handleFullscreenChange);

        if (window.matchMedia) {
            try {
                var landscapeMql = window.matchMedia('(orientation: landscape)');
                function onOrientationMqlChange(e) {
                    var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (window.innerWidth <= 900 && 'ontouchstart' in window);
                    if (!isMobile) return;
                    var isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
                    if (e.matches && !isFs) {
                        if ($video && !$video.paused) {
                            var container = document.getElementById('player-container') || $video;
                            if (container.requestFullscreen) {
                                container.requestFullscreen().catch(function() {});
                            } else if ($video.webkitEnterFullscreen) {
                                $video.webkitEnterFullscreen();
                            }
                        }
                    } else if (!e.matches && isFs) {
                        if (document.exitFullscreen) {
                            document.exitFullscreen().catch(function() {});
                        }
                    }
                }
                if (landscapeMql.addEventListener) {
                    landscapeMql.addEventListener('change', onOrientationMqlChange);
                } else if (landscapeMql.addListener) {
                    landscapeMql.addListener(onOrientationMqlChange);
                }
            } catch (e) {}
        }
    })();
    </script>

    <!-- Adsterra Social Bar -->
    <script type="text/javascript" src="https://pl31503799.profitableratecpmnetwork.com/de/42/cd/de42cdeb3c7aad7b416550c1f72cb2e0.js"></script>
</body>
