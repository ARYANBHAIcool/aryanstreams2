name: Auto-Sync Willow & Cricbuzz Feeds

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Feed Sync Script
        run: node scripts/sync_willow.js

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/willow.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Willow live match feeds [skip ci]" && git push)
