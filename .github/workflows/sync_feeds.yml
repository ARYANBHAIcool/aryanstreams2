name: Auto-Sync Live Feeds

on:
  schedule:
    # 7-minute staggered schedules matching doctor-8trange cadence
    - cron: '*/7 * * * *'
    - cron: '3,10,17,24,31,38,45,52 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [sync-feeds, refresh, ping]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Feed Sync Script
        run: node scripts/sync_feeds.js

      - name: Commit & Push Changes
        shell: bash
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$REPO_OWNER" = "ARYANBHAIcool" ]; then
            git config --global user.name "ARYANBHAIcool"
            git config --global user.email "kingaryan69and@gmail.com"
          else
            git config --global user.name "Aryan Kumar Singh"
            git config --global user.email "mearyankumarsingh@gmail.com"
          fi

          # Pull latest remote changes cleanly
          git fetch origin main
          git rebase -X theirs origin/main || git rebase --abort || true

          # Stage freshly generated feeds
          git add data/sports.json data/sports.m3u data/willow.json data/sony_m3u8.json

          if ! git diff --staged --quiet; then
            TIMESTAMP=$(date -u +"%d/%m/%Y, %I:%M:%S %p UTC")
            git commit -m "📡 refreshed playlist @ ${TIMESTAMP} • Catch the thrill live! ⚡" || true
            
            # Safe push with automatic retry if remote had a concurrent push
            for attempt in 1 2 3; do
              if git push origin main; then
                echo "Successfully pushed changes on attempt $attempt"
                break
              fi
              echo "Push attempt $attempt failed, rebasing with latest remote..."
              git fetch origin main
              git rebase -X theirs origin/main || git rebase --abort || true
              sleep 2
            done
          else
            echo "Feeds are already completely up to date with remote."
          fi
