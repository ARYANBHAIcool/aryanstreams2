name: Auto-Sync Live Feeds

on:
  schedule:
    # Staggered schedules to avoid GitHub peak-minute queuing delays
    - cron: '*/10 * * * *'
    - cron: '5,15,25,35,45,55 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [sync-feeds, refresh, ping]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Feed Sync Script
        run: node scripts/sync_feeds.js

      - name: Commit & Push Changes
        shell: bash
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$REPO_OWNER" = "ARYANBHAIcool" ]; then
            git config --global user.name "ARYANBHAIcool"
            git config --global user.email "kingaryan69and@gmail.com"
          else
            git config --global user.name "Aryan Kumar Singh"
            git config --global user.email "mearyankumarsingh@gmail.com"
          fi

          git add data/sports.json data/sports.m3u data/willow.json data/sony_m3u8.json

          if ! git diff --quiet || ! git diff --staged --quiet; then
            TIMESTAMP=$(date -u +"%d/%m/%Y, %I:%M:%S %p UTC")
            git commit -m "📡 refreshed playlist @ ${TIMESTAMP} • Catch the thrill live! ⚡"
            git pull --rebase origin main || true
            git push origin main
          fi
