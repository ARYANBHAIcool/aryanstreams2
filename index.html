        :root {
            --bg-color: #09090b;
            --card-bg: rgba(20, 20, 23, 0.7);
            --border-color: rgba(39, 39, 42, 0.7);
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --accent-green: #22c55e;
            --accent-green-hover: #16a34a;
            --text-main: #f4f4f5;
            --text-secondary: #a1a1aa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            overflow-x: hidden;
            background-image: radial-gradient(circle at top center, rgba(59, 130, 246, 0.08) 0%, transparent 60%);
        }

        /* Overlay */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 9999; backdrop-filter: blur(8px); }
        .overlay.hidden { display: none !important; }
        .overlay-box {
            background: rgba(15, 15, 18, 0.85);
            padding: 2.5rem 2rem;
            border-radius: 1.25rem;
            border: 1px solid var(--border-color);
            text-align: center;
            max-width: 380px;
            margin: 1rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 20px rgba(59, 130, 246, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transform: scale(1);
            transition: transform 0.3s ease;
        }
        .overlay-icon { font-size: 3.5rem; margin-bottom: 1.25rem; filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.4)); animation: pulse-icon 2s infinite ease-in-out; }
        @keyframes pulse-icon {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        .overlay-title { font-size: 1.65rem; font-weight: 700; margin-bottom: 0.75rem; letter-spacing: -0.02em; }
        .overlay-text { color: var(--text-secondary); margin-bottom: 1.75rem; font-size: 0.95rem; line-height: 1.5; }
        
        .overlay-btn { 
            display: block; 
            background: linear-gradient(135deg, #3b82f6, #1d4ed8); 
            color: white; 
            padding: 0.85rem 1.5rem; 
            border-radius: 0.75rem; 
            font-weight: 600; 
            text-decoration: none; 
            cursor: pointer; 
            border: none; 
            width: 100%; 
            font-size: 1rem; 
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: all 0.2s ease; 
        }
        .overlay-btn:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.45);
            background: linear-gradient(135deg, #4f46e5, #2563eb); 
        }
        .overlay-btn-secondary { 
            display: block; 
            background: rgba(39, 39, 42, 0.6); 
            color: #e4e4e7; 
            padding: 0.85rem 1.5rem; 
            border-radius: 0.75rem; 
            font-weight: 600; 
            text-decoration: none; 
            cursor: pointer; 
            border: 1px solid rgba(63, 63, 70, 0.5); 
            width: 100%; 
            font-size: 1rem; 
            margin-top: 0.75rem; 
            transition: all 0.2s ease; 
        }
        .overlay-btn-secondary:hover { 
            background: rgba(63, 63, 70, 0.85); 
            color: white;
        }

        /* Header */
        header { 
            width: 100%; 
            padding: 0.85rem 1.5rem; 
            background: rgba(15, 15, 18, 0.8); 
            border-bottom: 1px solid var(--border-color); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 1rem; 
            position: sticky; 
            top: 0; 
            z-index: 50; 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .header-label { font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
        .btn-tg { 
            background: linear-gradient(135deg, #0088cc, #0077b5); 
            color: white; 
            padding: 0.35rem 1.25rem; 
            border-radius: 9999px; 
            font-size: 0.8rem; 
            font-weight: 600; 
            text-decoration: none; 
            box-shadow: 0 4px 10px rgba(0, 136, 204, 0.2);
            transition: all 0.2s ease; 
        }
        .btn-tg:hover { 
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(0, 136, 204, 0.35);
        }

        /* Main */
        main { width: 100%; max-width: 960px; padding: 1.5rem 1rem; margin-top: 0.5rem; flex-grow: 1; }
        .hidden { display: none !important; }

        /* Stream view */
        .channel-title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        #channel-name { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.01em; color: white; display: flex; align-items: center; gap: 0.5rem; }
        
        /* Live Indicator Dot */
        .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 8px #ef4444;
            animation: pulse-dot 1.5s infinite ease-in-out;
            margin-right: 0.25rem;
        }
        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.4; }
        }

        /* Video containers */
        .player-wrap { 
            position: relative; 
            width: 100%; 
            padding-bottom: 56.25%; 
            background: #000; 
            border-radius: 1rem; 
            overflow: hidden; 
            border: 1px solid var(--border-color); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); 
        }
        .player-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        /* Clappr target container */
        #live-player-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Styling inside Clappr to match dark theme aesthetics */
        .clappr-style {
            background-color: #000 !important;
        }

        /* Loading spinner inside player */
        .spinner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; z-index: 2; transition: opacity 0.5s; }
        .spinner-ring { width: 48px; height: 48px; border: 4px solid rgba(255, 255, 255, 0.1); border-top-color: var(--accent-blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Customizing Plyr CSS Variables to fit design system */
        :root {
            --plyr-color-main: #3b82f6; /* Accent blue */
            --plyr-video-background: #000000;
            --plyr-font-family: 'Outfit', sans-serif;
            --plyr-border-radius: 1rem;
        }
        .plyr {
            border-radius: 1rem !important;
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            width: 100% !important;
            height: 100% !important;
        }
        .plyr--full-ui input[type=range] {
            color: #3b82f6 !important;
        }
        .plyr__control--overlaid {
            background: rgba(59, 130, 246, 0.9) !important;
        }
        .plyr__control--overlaid:hover {
            background: #2563eb !important;
        }
        .plyr__control[aria-expanded=true] {
            background: #3b82f6 !important;
            color: white !important;
        }

        /* Error view */
        #error-view { 
            text-align: center; 
            padding: 5rem 2rem; 
            border: 1px solid var(--border-color); 
            border-radius: 1rem; 
            background: var(--card-bg);

            border-radius: 0.75rem; 
            font-weight: 600; 
            text-decoration: none; 
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);

        /* Floating Telegram Button */
        #float-tg {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 999;
            display: flex;
            align-items: center;

            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 8px 24px rgba(0, 136, 204, 0.6);

            width: 18px;
            height: 18px;

        // Parse custom headers from the stream URL containing a pipe parameter
        function parseStreamUrl(url) {
            let baseUrl = url;
            let headers = {};
            
            // Check for raw pipe symbol | or url-encoded %7C
            let pipeIndex = url.indexOf('|');
            if (pipeIndex === -1) {
                pipeIndex = url.indexOf('%7C');
            }
            
            if (pipeIndex !== -1) {
                baseUrl = url.substring(0, pipeIndex);
                const separatorLength = url.charAt(pipeIndex) === '|' ? 1 : 3;
                let headerStr = url.substring(pipeIndex + separatorLength);
                
                try {
                    headerStr = decodeURIComponent(headerStr);
                } catch(e) {}
                
                const params = new URLSearchParams(headerStr);
                for (const [key, value] of params.entries()) {
                    headers[key] = value;
                }
            }
            
            return { baseUrl, headers };
        }

        // Helper to format url with proxy configuration
        function getPlayableUrl(url) {
            const parsed = parseStreamUrl(url);
            const isAkamai = parsed.baseUrl.includes('akamaized.net') || parsed.baseUrl.includes('slivcdn.com');
            const hasHeaders = Object.keys(parsed.headers).length > 0;

            if (isAkamai || hasHeaders) {
                // Determine proxy endpoint based on current page path
                const proxyUrl = location.pathname.includes('/fancode/') ? '/fancode/proxy' : '/proxy';
                const queryParams = new URLSearchParams();
                queryParams.append('url', parsed.baseUrl);
                for (const [k, v] of Object.entries(parsed.headers)) {
                    queryParams.append(k, v);
                }
                return `${proxyUrl}?${queryParams.toString()}`;
            }
            return parsed.baseUrl;
        }

        function loadPlyr(src) {
            // Destroy any previous instances
            if (plyrPlayer) {
                plyrPlayer.destroy();
                plyrPlayer = null;
            }
            if (hlsInstance) {

            if (spinner) {
                spinner.style.display = 'flex';

                        }

                            'play',
                            'progress',
                            'current-time',

                            'volume',
                            'settings',
                            'pip',
                            'fullscreen'

                    };

                var ch = channels[streamKey];
                document.getElementById('stream-view').classList.remove('hidden');
                document.getElementById('channel-name').innerHTML = '<span class="live-dot"></span> ' + ch.name;

                if (ch.type === 'video') {
                    document.getElementById('video-container-div').classList.remove('hidden');
                    loadPlyr(ch.url);
                } else {
                    document.getElementById('iframe-container-div').classList.remove('hidden');
                    document.getElementById('embed-frame').src = ch.url;
                }
            } else {
                document.getElementById('error-view').classList.remove('hidden');
            }
        };
    </script>

</body>
</html>
