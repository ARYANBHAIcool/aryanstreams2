<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Extractor — AryanStreams</title>
  <!-- Shaka Player for DASH MPD preview -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
  <!-- Hls.js for HLS M3U8 preview -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #0a0a0f;
      --card: #111118;
      --border: #1e1e2a;
      --accent: #3b82f6;
      --accent2: #22c55e;
      --text: #e4e4e7;
      --muted: #71717a;
      --danger: #ef4444;
      --warn: #f59e0b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 20px;
    }

    .container { max-width: 960px; margin: 0 auto; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { font-size: 1.8rem; font-weight: 800; }
    h1 span { color: var(--accent); }
    .subtitle { color: var(--muted); font-size: 0.9rem; }

    /* ── Tabs ─────────────────────────────────────── */
    .tabs { display: flex; gap: 6px; margin-bottom: 20px; }
    .tab {
      padding: 10px 20px; border-radius: 8px; cursor: pointer;
      font-size: 0.88rem; font-weight: 600;
      background: var(--card); border: 1px solid var(--border); color: var(--muted);
      transition: all 0.15s;
    }
    .tab:hover { background: rgba(255,255,255,0.05); color: var(--text); }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* ── Input Section ──────────────────────────── */
    .section-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .input-row { display: flex; gap: 10px; }
    input, select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 12px 14px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: var(--accent); }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #2563eb; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-green { background: var(--accent2); color: #000; font-weight: 800; }
    .btn-green:hover { background: #16a34a; }
    .btn-green:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-sm { padding: 8px 14px; font-size: 0.82rem; border-radius: 6px; }
    .btn-play { background: rgba(59,130,246,0.18); border: 1px solid rgba(59,130,246,0.4); color: #60a5fa; }
    .btn-play:hover { background: rgba(59,130,246,0.32); color: #fff; }

    /* ── Status ──────────────────────────────────── */
    .status {
      padding: 10px 14px;
      border-radius: 8px;
      margin-top: 12px;
      font-size: 0.85rem;
      display: none;
    }
    .status.loading { display: block; background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.2); color: #93c5fd; }
    .status.error { display: block; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); color: #fca5a5; }
    .status.success { display: block; background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.2); color: #86efac; }
    .status.warn { display: block; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.2); color: #fcd34d; }

    /* ── Results ─────────────────────────────────── */
    .results-header { 
      display: flex; align-items: center; justify-content: space-between;
      margin: 20px 0 12px;
    }
    .badge {
      font-size: 0.75rem; padding: 3px 10px; border-radius: 20px;
      font-weight: 700; display: inline-block;
    }
    .badge-blue { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .badge-green { background: rgba(34,197,94,0.15); color: #4ade80; }
    .badge-yellow { background: rgba(234,179,8,0.15); color: #facc15; }
    .badge-purple { background: rgba(168,85,247,0.15); color: #c084fc; }

    .stream-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }
    .stream-card:hover { border-color: rgba(59,130,246,0.3); }
    .stream-card .top-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .stream-card .name { font-weight: 700; font-size: 0.95rem; }
    .stream-card .url-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 0.75rem;
      word-break: break-all;
      color: var(--muted);
      margin-bottom: 8px;
      max-height: 60px;
      overflow-y: auto;
    }
    .key-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      margin-bottom: 10px;
    }
    .key-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
    }
    .key-box label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .key-box .val {
      font-family: 'Cascadia Code', monospace;
      font-size: 0.8rem;
      color: var(--accent2);
      word-break: break-all;
    }

    /* ── Add to Index Form ───────────────────────── */
    .add-form {
      display: flex; gap: 8px; align-items: center;
      margin-top: 10px; padding-top: 10px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .add-form input { flex: 1; min-width: 160px; }
    .overwrite-label {
      font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; gap: 4px; cursor: pointer;
    }

    .add-status {
      font-size: 0.78rem;
      margin-top: 6px;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .add-status.ok { color: var(--accent2); }
    .add-status.err { color: var(--danger); }

    .empty-state {
      text-align: center; padding: 40px;
      color: var(--muted); font-size: 0.9rem;
    }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 10px; }

    /* ── Copy button ─────────────────────────────── */
    .copy-btn {
      background: transparent; border: 1px solid var(--border);
      color: var(--muted); padding: 4px 8px; border-radius: 4px;
      font-size: 0.72rem; cursor: pointer; transition: all 0.15s;
    }
    .copy-btn:hover { background: rgba(255,255,255,0.05); color: var(--text); }

    /* ── Manual Section ──────────────────────────── */
    .manual-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      margin-bottom: 12px;
    }
    .manual-grid.full { grid-template-columns: 1fr; }

    /* ── Channels Table ──────────────────────────── */
    .channel-table {
      width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.85rem;
    }
    .channel-table th, .channel-table td {
      padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border);
    }
    .channel-table th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 0.72rem; }
    .channel-table tr:hover { background: rgba(255,255,255,0.02); }

    /* ── Player Modal ─────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; z-index: 10000; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal-card {
      background: #0f1017; border: 1px solid var(--border); border-radius: 14px;
      width: 100%; max-width: 800px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }
    .modal-header {
      padding: 14px 18px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-header h3 { font-size: 1rem; font-weight: 700; }
    .modal-close {
      background: none; border: none; color: var(--muted); font-size: 1.3rem; cursor: pointer;
    }
    .modal-close:hover { color: #fff; }
    .video-wrap {
      width: 100%; aspect-ratio: 16/9; background: #000; position: relative;
    }
    .video-wrap video, .video-wrap iframe { width: 100%; height: 100%; border: 0; }
    .player-error {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.8); color: #f87171; font-size: 0.9rem; text-align: center; padding: 20px;
    }

    @media (max-width: 600px) {
      .input-row { flex-direction: column; }
      .key-row, .manual-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>🔍 Stream <span>Extractor</span></h1>
        <p class="subtitle">Extract MPD & ClearKeys, Preview Live Streams, and Save Directly into index.html</p>
      </div>
    </header>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('extract', this)">🔍 Auto Extract</div>
      <div class="tab" onclick="switchTab('manual', this)">✏️ Manual Add</div>
      <div class="tab" onclick="switchTab('channels', this)">📑 Existing Channels (<span id="chan-count">0</span>)</div>
    </div>

    <!-- Auto Extract Tab -->
    <div id="tab-extract">
      <div class="section-box">
        <div class="input-row">
          <input type="text" id="urlInput" placeholder="Paste stream URL (e.g. https://footsters-tv.pages.dev/?play=1&stream=0)" autofocus>
          <button class="btn btn-primary" id="extractBtn" onclick="extract()">🔍 Extract Streams</button>
        </div>
        <div class="status" id="status"></div>
      </div>
      <div id="results"></div>
    </div>

    <!-- Manual Add Tab -->
    <div id="tab-manual" style="display:none">
      <div class="section-box">
        <h3 style="margin-bottom: 6px;">✏️ Manual Stream Entry</h3>
        <p style="color: var(--muted); font-size: 0.82rem; margin-bottom: 14px;">Paste MPD/Keys directly or direct M3U8 streams</p>

        <div class="manual-grid">
          <input type="text" id="m-key" placeholder="Channel Key (e.g. willoc_hd)">
          <input type="text" id="m-name" placeholder="Display Name (e.g. Willow Cricket HD)">
        </div>

        <div class="manual-grid">
          <select id="m-type">
            <option value="mpd">DASH MPD with ClearKey</option>
            <option value="iframe">Iframe Player Embed</option>
            <option value="m3u8">Direct M3U8 Video (HLS)</option>
          </select>
          <label class="overwrite-label" style="align-self: center;">
            <input type="checkbox" id="m-overwrite"> Overwrite if channel key already exists
          </label>
        </div>

        <div class="manual-grid full">
          <input type="text" id="m-url" placeholder="Stream URL or Manifest (.mpd / .m3u8 / embed link)">
        </div>
        <div class="manual-grid" id="m-keys-row">
          <input type="text" id="m-kid" placeholder="KID (32 hex characters)">
          <input type="text" id="m-key2" placeholder="KEY (32 hex characters)">
        </div>

        <div style="display:flex; gap:10px; margin-top:10px;">
          <button class="btn btn-green" onclick="manualAdd()">⚡ Add to index.html</button>
          <button class="btn btn-play" onclick="previewManual()">▶️ Test Play</button>
        </div>
        <div class="status" id="m-status" style="margin-top:10px;"></div>
      </div>
    </div>

    <!-- Existing Channels Tab -->
    <div id="tab-channels" style="display:none">
      <div class="section-box">
        <div class="input-row" style="margin-bottom:12px;">
          <input type="text" id="searchChannels" placeholder="Filter channels by key, name, or type..." oninput="renderChannels()">
          <button class="btn btn-primary btn-sm" onclick="loadChannels()">🔄 Refresh</button>
        </div>
        <div style="max-height: 500px; overflow-y: auto;">
          <table class="channel-table">
            <thead>
              <tr>
                <th>Type</th>
                <th>Key</th>
                <th>Name</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="channels-tbody">
              <tr><td colspan="4" style="text-align:center; color:var(--muted)">Loading channels...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Player Preview Modal -->
  <div class="modal-overlay" id="playerModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle">▶️ Stream Preview</h3>
        <button class="modal-close" onclick="closePlayerModal()">×</button>
      </div>
      <div class="video-wrap" id="videoWrap">
        <video id="previewVideo" controls autoplay playsinline></video>
        <div class="player-error" id="playerError"></div>
      </div>
    </div>
  </div>

  <script>
    let allChannels = [];
    let activeShakaPlayer = null;
    let activeHls = null;

    const urlInput = document.getElementById('urlInput');
    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');

    urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') extract(); });

    document.getElementById('m-type').addEventListener('change', e => {
      document.getElementById('m-keys-row').style.display = e.target.value === 'mpd' ? 'grid' : 'none';
    });

    function switchTab(tab, el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById('tab-extract').style.display = tab === 'extract' ? 'block' : 'none';
      document.getElementById('tab-manual').style.display = tab === 'manual' ? 'block' : 'none';
      document.getElementById('tab-channels').style.display = tab === 'channels' ? 'block' : 'none';
      el.classList.add('active');
      if (tab === 'channels') loadChannels();
    }

    function setStatus(msg, type) {
      statusEl.className = 'status ' + type;
      statusEl.innerHTML = msg;
    }

    async function extract() {
      const url = urlInput.value.trim();
      if (!url) { setStatus('⚠️ Please enter a stream URL', 'error'); return; }

      setStatus('⏳ Extracting streams... (fetching page, bypassing challenges, traversing APIs...)', 'loading');
      document.getElementById('extractBtn').disabled = true;

      try {
        const res = await fetch('/api/extract', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Extraction failed');

        if (data.warning) setStatus(`⚠️ ${data.warning}`, 'warn');

        if (data.streams.length === 0) {
          if (!data.warning) setStatus('⚠️ No streams found. Try the Manual Add tab.', 'error');
          resultsEl.innerHTML = '<div class="empty-state"><div class="icon">📭</div>No streams extracted.<br>Use <strong>Manual Add</strong> tab to paste MPD/keys directly.</div>';
        } else {
          if (!data.warning) setStatus(`✅ Found <strong>${data.streams.length}</strong> stream(s)!`, 'success');
          renderResults(data.streams);
        }
      } catch (e) {
        setStatus('❌ ' + e.message, 'error');
      } finally {
        document.getElementById('extractBtn').disabled = false;
      }
    }

    function renderResults(streams) {
      let html = `<div class="results-header"><h2>Extracted Streams</h2><span class="badge badge-blue">${streams.length} found</span></div>`;

      streams.forEach((s, i) => {
        const isMpd = s.type === 'mpd';
        const isM3u8 = s.type === 'm3u8';
        const isIframe = s.type === 'iframe';
        const streamUrl = s.mpd || s.url || '';
        const displayName = s.name || (isMpd ? 'DASH Stream' : isM3u8 ? 'HLS Stream' : 'Embed') + ` #${i + 1}`;
        const typeBadge = isMpd ? '<span class="badge badge-green">MPD</span>' : 
                          isM3u8 ? '<span class="badge badge-yellow">M3U8</span>' : 
                          '<span class="badge badge-purple">IFRAME</span>';
        const hasKeys = s.kid && s.key;
        const defaultKey = displayName.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase().substring(0, 30);

        html += `
          <div class="stream-card" id="card-${i}">
            <div class="top-row">
              ${typeBadge}
              <span class="name">${esc(displayName)}</span>
              <button class="copy-btn" onclick="copyText('${esc(streamUrl)}', this)">📋 URL</button>
              ${hasKeys ? `<button class="copy-btn" onclick="copyText('${esc(s.kid)}', this)">📋 KID</button><button class="copy-btn" onclick="copyText('${esc(s.key)}', this)">📋 KEY</button>` : ''}
              <button class="btn btn-play btn-sm" style="margin-left:auto" onclick="playStream(${JSON.stringify(s).replace(/"/g, '&quot;')}, '${esc(displayName)}')">▶️ Test Play</button>
            </div>
            <div class="url-box">${esc(streamUrl)}</div>
            ${hasKeys ? `
              <div class="key-row">
                <div class="key-box">
                  <label>KID</label>
                  <div class="val">${esc(s.kid)}</div>
                </div>
                <div class="key-box">
                  <label>KEY</label>
                  <div class="val">${esc(s.key)}</div>
                </div>
              </div>
            ` : ''}
            <div class="add-form">
              <input type="text" id="key-${i}" placeholder="Channel key (e.g. premier_league_1)" value="${esc(defaultKey)}">
              <input type="text" id="name-${i}" placeholder="Display name" value="${esc(displayName)}">
              <label class="overwrite-label"><input type="checkbox" id="overwrite-${i}"> Overwrite</label>
              <button class="btn btn-green btn-sm" onclick="addToIndex(${i}, ${JSON.stringify(s).replace(/"/g, '&quot;')})">⚡ Add to Index</button>
            </div>
            <div class="add-status" id="add-status-${i}"></div>
          </div>
        `;
      });

      resultsEl.innerHTML = html;
    }

    async function addToIndex(idx, stream) {
      const channelKey = document.getElementById(`key-${idx}`).value.trim();
      const channelName = document.getElementById(`name-${idx}`).value.trim();
      const overwrite = document.getElementById(`overwrite-${idx}`).checked;
      const statusDiv = document.getElementById(`add-status-${idx}`);

      if (!channelKey) { statusDiv.className = 'add-status err'; statusDiv.textContent = '⚠️ Enter a channel key!'; return; }
      if (!channelName) { statusDiv.className = 'add-status err'; statusDiv.textContent = '⚠️ Enter a display name!'; return; }

      try {
        const res = await fetch('/api/add-to-index', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            channelKey, channelName, type: stream.type,
            url: stream.url, mpd: stream.mpd, kid: stream.kid, key: stream.key, overwrite
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        statusDiv.className = 'add-status ok';
        statusDiv.textContent = `✅ Successfully added "${channelKey}" into index.html!`;
        loadChannels();
      } catch (e) {
        statusDiv.className = 'add-status err';
        statusDiv.textContent = '❌ ' + e.message;
      }
    }

    async function manualAdd() {
      const channelKey = document.getElementById('m-key').value.trim();
      const channelName = document.getElementById('m-name').value.trim();
      const type = document.getElementById('m-type').value;
      const url = document.getElementById('m-url').value.trim();
      const kid = document.getElementById('m-kid').value.trim();
      const key = document.getElementById('m-key2').value.trim();
      const overwrite = document.getElementById('m-overwrite').checked;
      const statusDiv = document.getElementById('m-status');

      if (!channelKey) { statusDiv.className = 'status error'; statusDiv.textContent = '⚠️ Channel Key is required!'; return; }
      if (!channelName) { statusDiv.className = 'status error'; statusDiv.textContent = '⚠️ Display Name is required!'; return; }
      if (!url) { statusDiv.className = 'status error'; statusDiv.textContent = '⚠️ URL is required!'; return; }

      try {
        const res = await fetch('/api/add-to-index', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            channelKey, channelName, type,
            url: type !== 'mpd' ? url : undefined,
            mpd: type === 'mpd' ? url : undefined,
            kid, key, overwrite
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        statusDiv.className = 'status success';
        statusDiv.textContent = `✅ Added "${channelKey}" to index.html!`;
        loadChannels();
      } catch (e) {
        statusDiv.className = 'status error';
        statusDiv.textContent = '❌ ' + e.message;
      }
    }

    /* ── Video Player Preview ────────────────────── */
    async function playStream(stream, name) {
      const modal = document.getElementById('playerModal');
      const title = document.getElementById('modalTitle');
      const errEl = document.getElementById('playerError');
      const video = document.getElementById('previewVideo');
      const wrap = document.getElementById('videoWrap');

      title.textContent = `▶️ Preview: ${name}`;
      errEl.style.display = 'none';
      modal.classList.add('open');

      destroyPlayers();

      const streamUrl = stream.mpd || stream.url;

      if (stream.type === 'mpd') {
        video.style.display = 'block';
        shaka.polyfill.installAll();
        if (shaka.Player.isBrowserSupported()) {
          activeShakaPlayer = new shaka.Player(video);
          if (stream.kid && stream.key) {
            activeShakaPlayer.configure({
              drm: { clearKeys: { [stream.kid]: stream.key } }
            });
          }
          activeShakaPlayer.load(streamUrl).catch(e => {
            errEl.textContent = 'Playback error: ' + (e.message || JSON.stringify(e));
            errEl.style.display = 'flex';
          });
        }
      } else if (stream.type === 'm3u8' || (streamUrl && streamUrl.includes('.m3u8'))) {
        video.style.display = 'block';
        if (Hls.isSupported()) {
          activeHls = new Hls();
          activeHls.loadSource(streamUrl);
          activeHls.attachMedia(video);
          activeHls.on(Hls.Events.ERROR, (e, data) => {
            if (data.fatal) {
              errEl.textContent = 'HLS error: ' + data.type;
              errEl.style.display = 'flex';
            }
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = streamUrl;
        }
      } else {
        // Iframe embed preview
        video.style.display = 'none';
        const iframe = document.createElement('iframe');
        iframe.src = streamUrl;
        iframe.allow = 'autoplay; fullscreen; encrypted-media';
        wrap.appendChild(iframe);
      }
    }

    function previewManual() {
      const type = document.getElementById('m-type').value;
      const url = document.getElementById('m-url').value.trim();
      const kid = document.getElementById('m-kid').value.trim();
      const key = document.getElementById('m-key2').value.trim();
      const name = document.getElementById('m-name').value.trim() || 'Manual Stream';

      if (!url) return alert('Enter a URL first');
      playStream({ type, url, mpd: type === 'mpd' ? url : undefined, kid, key }, name);
    }

    function destroyPlayers() {
      if (activeShakaPlayer) { activeShakaPlayer.destroy(); activeShakaPlayer = null; }
      if (activeHls) { activeHls.destroy(); activeHls = null; }
      const video = document.getElementById('previewVideo');
      video.src = '';
      const iframes = document.querySelectorAll('#videoWrap iframe');
      iframes.forEach(f => f.remove());
    }

    function closePlayerModal() {
      destroyPlayers();
      document.getElementById('playerModal').classList.remove('open');
    }

    /* ── Load Channels ────────────────────────────── */
    async function loadChannels() {
      try {
        const res = await fetch('/api/channels');
        const data = await res.json();
        if (data.success) {
          allChannels = data.channels || [];
          document.getElementById('chan-count').textContent = allChannels.length;
          renderChannels();
        }
      } catch {}
    }

    function renderChannels() {
      const query = (document.getElementById('searchChannels').value || '').toLowerCase();
      const filtered = allChannels.filter(c => 
        c.key.toLowerCase().includes(query) || 
        c.name.toLowerCase().includes(query) || 
        c.type.toLowerCase().includes(query)
      );

      const tbody = document.getElementById('channels-tbody');
      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--muted)">No matching channels found</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(c => `
        <tr>
          <td><span class="badge ${c.type === 'video' ? 'badge-yellow' : 'badge-purple'}">${c.type.toUpperCase()}</span></td>
          <td style="font-family:monospace; color:var(--accent2);">${esc(c.key)}</td>
          <td><strong>${esc(c.name)}</strong></td>
          <td>
            <button class="btn btn-play btn-sm" onclick="playStream({type: '${c.type === 'video' ? 'm3u8' : 'iframe'}', url: '${esc(c.url)}'}, '${esc(c.name)}')">▶️ Play</button>
            <button class="copy-btn" onclick="copyText('${esc(c.key)}', this)">📋 Copy Key</button>
          </td>
        </tr>
      `).join('');
    }

    function copyText(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const orig = btn.textContent;
        btn.textContent = '✅ Copied';
        setTimeout(() => btn.textContent = orig, 1500);
      });
    }

    function esc(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Initial load
    loadChannels();
  </script>
</body>
</html>
